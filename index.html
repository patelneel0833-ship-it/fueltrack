    <div class="note" style="margin-top:8px">${lblA} covers ${fmtShort(cb.a)} – ${fmtShort(A?A.eb:cb.b)}${A&&A.eb<cb.b?' (so far)':''}. Calendar ${wk?'weeks (Mon–Sun)':'months'}, independent of the range above. Averages use logged days only. Δ is vs ${lblB.toLowerCase()}.</div>`;
  const items=[];for(let o=-7;o<=0;o++){const b=periodBounds(aPer,o),st=periodStats(b.a,b.b);items.push({label:wk?fmtShort(b.a):parseDS(b.a).toLocaleDateString('en-US',{month:'short'}),v:st&&st.n?st.avgCal:null,color:st&&st.n&&st.avgCal>c.gc*1.05?'#ef4444':'#f97316',tip:(wk?'Week of ':'')+fmtShort(b.a)+': '+(st&&st.n?fmtN(st.avgCal)+' kcal avg':'no logs')});}
  const detail=`<div class="sub-t">Average calories — last 8 ${wk?'weeks':'months'}</div>${chartOrNone(barChartSVG(items,{target:c.gc,w:CH.w,fs:CH.fs,h:140}))}<div class="legend"><span><i style="background:#f97316"></i>Avg per logged day</span><span><i style="background:#a78bfa"></i>Target ${c.gc}</span></div>
    <div class="note" style="margin-top:6px">Short-period weight changes include water and glycogen and are not purely fat. The deficit is a calculated estimate.</div>`;
  return secCard('period',{title:'Period summary',action:seg,body:body,detail:detail});
}

// ── 9. Data & backup (kept from the old Backup tab) ──
function secData(){
  const open=!!aOpen.data;
  return `<section class="acard" id="ac-data"><div class="ac-top"><button class="ac-title" onclick="toggleA('data')" aria-expanded="${open}">💾 Data &amp; backup</button></div>
    <div class="ac-tap" onclick="toggleA('data')"><div class="note">Export a backup, download CSVs, or restore from a file.</div></div>
    <button class="ac-more-btn" onclick="toggleA('data')">${open?'Hide':'Show'}<span class="chev ${open?'up':''}">▾</span></button>
    ${open?`<div class="ac-more">${renderAData()}</div>`:''}</section>`;
}

function renderAnalytics(){
  if(bkFlash)aOpen.data=true;
  const c=aCtx(),cur=aAgg(c,c.a,c.t),prv=c.prev?aAgg(c,c.prev.a,c.prev.b):null;
  let h=`<div class="a-bar"><div class="a-seg" role="group" aria-label="Date range">${RANGES.map(function(r){return `<button class="${aRange===r[0]?'on':''}" onclick="setARange(${r[0]})" aria-pressed="${aRange===r[0]}">${r[1]}</button>`;}).join('')}</div></div>`;
  h+=secOverview(c,cur,prv)+secWeight(c)+secEnergy(c,cur,prv)+secNutrition(c,cur,prv)+secConsistency(c,cur)+secWaist(c)+secGoal(c)+secPeriod(c)+secData();
  requestAnimationFrame(function(){setHH();if(aJump){const el=document.getElementById('ac-'+aJump);aJump=null;if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}});
  return h;
}

// ════════════════ THEMES, EFFECTS & INTERACTION ════════════════
const THEMES=[
  {id:'midnight',name:'Midnight',d:'The classic FuelTrack indigo',bg:'linear-gradient(135deg,#1e1b4b,#020617)',dots:['#6366f1','#a78bfa'],meta:'#020617'},
  {id:'aurora',name:'Aurora',d:'Drifting northern lights',bg:'linear-gradient(135deg,#064e3b,#0c2a4a)',dots:['#10b981','#06b6d4'],meta:'#02100f'},
  {id:'neon',name:'Cyber Neon',d:'Glowing grid, magenta & cyan',bg:'linear-gradient(135deg,#3b0764,#04202b)',dots:['#ff2bd6','#00e5ff'],meta:'#07020f'},
  {id:'solar',name:'Solar Flare',d:'Rising embers on deep red',bg:'linear-gradient(135deg,#7c2d12,#450a0a)',dots:['#f97316','#ef4444'],meta:'#0f0503'},
  {id:'space',name:'Deep Space',d:'Twinkling stars & shooting comets',bg:'linear-gradient(135deg,#2e1065,#01010a)',dots:['#7c3aed','#22d3ee'],meta:'#01010a'}
];
function uiGet(k,fb){try{const v=localStorage.getItem(k);return v==null?fb:v;}catch(e){return fb;}}
function uiSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let curTheme=uiGet('ftui_theme','midnight');
if(!THEMES.some(function(t){return t.id===curTheme;}))curTheme='midnight';
let motionOn=uiGet('ftui_motion','on')!=='off';
function applyTheme(id,persistIt){
  const t=THEMES.filter(function(x){return x.id===id;})[0]||THEMES[0];
  curTheme=t.id;document.documentElement.setAttribute('data-theme',t.id);
  document.documentElement.setAttribute('data-motion',motionOn?'on':'off');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t.meta);
  if(persistIt!==false)uiSet('ftui_theme',t.id);
  fxStart();
}
function setMotion(on){motionOn=on;uiSet('ftui_motion',on?'on':'off');document.documentElement.setAttribute('data-motion',on?'on':'off');fxStart();if(document.getElementById('themeModal'))openThemes();}
function pickTheme(id){applyTheme(id);buzz(12);openThemes();}
function openThemes(){
  const y=(document.querySelector('#modalContainer .modal')||{}).scrollTop||0;
  document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" id="themeModal" onclick="if(event.target===this)closeModal()"><div class="modal" style="animation:none">
    <div class="modal-handle"><div class="modal-handle-bar"></div></div>
    <div class="modal-header"><span class="modal-title">🎨 Themes</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${THEMES.map(function(t){return `<button class="th-card ${t.id===curTheme?'on':''}" onclick="pickTheme('${t.id}')"><div class="th-sw" style="background:${t.bg}"><i style="width:26px;height:26px;left:8px;top:6px;background:${t.dots[0]};box-shadow:0 0 14px ${t.dots[0]}"></i><i style="width:18px;height:18px;right:8px;bottom:6px;background:${t.dots[1]};box-shadow:0 0 12px ${t.dots[1]}"></i></div><div style="flex:1"><div class="th-n">${t.name}</div><div class="th-d">${t.d}</div></div>${t.id===curTheme?'<span style="color:var(--acs);font-size:20px">✓</span>':''}</button>`;}).join('')}
      <div class="th-sw-row"><span>Animated backgrounds &amp; effects</span><button class="sw ${motionOn?'on':''}" onclick="setMotion(${!motionOn})" aria-label="Toggle animations" aria-pressed="${motionOn}"></button></div>
      <div class="note">Themes only change the look — your data is untouched. Animations pause automatically if your device asks for reduced motion.</div></div></div></div>`;
  const mm=document.querySelector('#modalContainer .modal');if(mm)mm.scrollTop=y;
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms||8);}catch(e){}}

// ── background canvas: stars (space) / embers (solar) ──
let fxRaf=0,fxParts=[],fxMode=null,fxShoot=null;
function fxStart(){
  cancelAnimationFrame(fxRaf);fxRaf=0;
  const cv=document.getElementById('fx');if(!cv)return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  fxMode=!motionOn||reduce?null:(curTheme==='space'?'stars':curTheme==='solar'?'embers':null);
  const cx=cv.getContext('2d');cx.clearRect(0,0,cv.width,cv.height);
  if(!fxMode)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth,H=innerHeight,n=fxMode==='stars'?110:55;
  fxParts=[];for(let i=0;i<n;i++)fxParts.push(fxMode==='stars'?{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,t:Math.random()*6.28,s:Math.random()*.03+.01,z:Math.random()*.8+.2}:{x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,v:Math.random()*.6+.25,d:Math.random()*6.28,a:Math.random()*.6+.3});
  fxShoot=null;
  (function loop(){
    if(document.hidden){fxRaf=requestAnimationFrame(loop);return;}
    cx.clearRect(0,0,W,H);
    if(fxMode==='stars'){
      const sy=(window.scrollY||0)*.04;
      fxParts.forEach(function(p){p.t+=p.s;const a=.35+.65*Math.abs(Math.sin(p.t));cx.globalAlpha=a;cx.fillStyle=p.z>.7?'#c4b5fd':'#e0f2fe';const y=((p.y-sy*p.z*10)%H+H)%H;cx.beginPath();cx.arc(p.x,y,p.r,0,6.283);cx.fill();});
      if(!fxShoot&&Math.random()<.004)fxShoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
      if(fxShoot){const s=fxShoot;s.l+=1;const px=s.x+s.l*9,py=s.y+s.l*4.5;const g=cx.createLinearGradient(px,py,px-90,py-45);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(px,py);cx.lineTo(px-90,py-45);cx.stroke();if(s.l>60)fxShoot=null;}
    }else{
      fxParts.forEach(function(p){p.y-=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.4;if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}cx.globalAlpha=p.a*(p.y/H*.6+.4);const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba(253,186,116,1)');g.addColorStop(.4,'rgba(249,115,22,.55)');g.addColorStop(1,'rgba(239,68,68,0)');cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.283);cx.fill();});
    }
    cx.globalAlpha=1;fxRaf=requestAnimationFrame(loop);
  })();
}
let fxResizeT=0;window.addEventListener('resize',function(){clearTimeout(fxResizeT);fxResizeT=setTimeout(fxStart,200);});

// ── pointer spotlight + tap ripple + haptic tick ──
document.addEventListener('pointermove',function(e){
  const el=e.target.closest&&e.target.closest('.card,.acard,.tile,.stat-card');if(!el)return;
  const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');
},{passive:true});
document.addEventListener('pointerdown',function(e){
  const el=e.target.closest&&e.target.closest('.btn,.a-seg button,.mode-btn,.meal-pill,.ac-more-btn,.tab-btn');
  if(el&&!el.disabled&&motionOn){
    const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement('span');
    sp.className='rip';sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    el.appendChild(sp);setTimeout(function(){sp.remove();},650);
  }
  if(el||e.target.closest('.tile'))buzz(6);
  const c=e.target.closest&&e.target.closest('.card,.acard,.tile,.stat-card');
  if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');}
},{passive:true});

// ── count-up numbers + entrance animation (on tab entry only) ──
function countUp(root){
  if(!motionOn)return;
  root.querySelectorAll('.big,.tile-v,.stat-value').forEach(function(el){
    const n=el.firstChild;if(!n||n.nodeType!==3)return;
    const m=n.nodeValue.match(/^([+\-−]?)(\d[\d,]*\.?\d*)(.*)$/);if(!m)return;
    const raw=m[2],dec=(raw.split('.')[1]||'').length,comma=raw.indexOf(',')>=0,end=parseFloat(raw.replace(/,/g,''));
    if(!isFinite(end)||end===0)return;
    const t0=performance.now(),dur=700;
    (function step(t){
      const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=end*e;
      let txt=v.toFixed(dec);if(comma)txt=Number(txt).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      n.nodeValue=m[1]+txt+m[3];if(k<1)requestAnimationFrame(step);
    })(t0);
  });
}
function enterAnim(){
  const c=document.getElementById('mainContent');if(!c||!motionOn)return;
  c.classList.remove('enter');void c.offsetWidth;c.classList.add('enter');
  setTimeout(function(){c.classList.remove('enter');},900);
  countUp(c);
}

// ── confetti when today's protein goal is first reached ──
function confetti(){
  if(!motionOn)return;
  let cv=document.getElementById('confetti');if(!cv){cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);}
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const cx=cv.getContext('2d');cx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#34d399','#22d3ee','#fbbf24','#fb7185',getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#6366f1'];
  const ps=[];for(let i=0;i<110;i++)ps.push({x:W/2+(Math.random()-.5)*80,y:H*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,w:Math.random()*7+4,h:Math.random()*4+3,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  let f=0;(function loop(){
    cx.clearRect(0,0,W,H);ps.forEach(function(p){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-f/110);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
    if(++f<120)requestAnimationFrame(loop);else cv.remove();
  })();
}
function checkCelebrate(){
  try{
    const gp=S.goals.protein||150,t=today(),p=todayEntries().reduce(function(s,e){return s+(+e.protein||0);},0);
    if(p>=gp&&uiGet('ftui_cel','')!==t){uiSet('ftui_cel',t);confetti();buzz([20,40,20]);showToast('🎉 Protein goal hit for today!');}
  }catch(e){}
}

// ── INIT ──
ensureIds();
try{if((S.goals.protein||150)<=todayEntries().reduce(function(s,e){return s+(+e.protein||0);},0))uiSet('ftui_cel',today());}catch(e){}
applyTheme(curTheme,false);
initHeader();
setHH();
updateStreak();
render();
enterAnim();
</script>
