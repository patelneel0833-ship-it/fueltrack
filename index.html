<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FuelTrack"/>
<meta name="theme-color" content="#020617"/>
<title>FuelTrack</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ftui_theme")||"midnight");}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:transparent;font-family:'DM Sans',-apple-system,sans-serif;color:#f1f5f9;overflow-x:hidden;}
:root{--ac:#6366f1;--ac2:#8b5cf6;--acs:#a5b4fc;--acr:99,102,241;--bgr:2,6,23;--cr:15,23,42;--mr:13,20,38;--glow1:#1e1b4b;--glow2:#0c1a2e;--bg:#020617;--card:rgba(var(--cr),0.85);--border:rgba(255,255,255,0.08);--text:#f1f5f9;--sub:#64748b;--accent:var(--ac);--orange:#f97316;--cyan:#22d3ee;--purple:#a78bfa;--pink:#fb7185;--green:#34d399;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(var(--acr),0.3);border-radius:99px;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}

/* Layout */
html{background:radial-gradient(ellipse at 20% 0%,var(--glow1) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,var(--glow2) 0%,transparent 50%),var(--bg) fixed;}
#app{min-height:100vh;position:relative;z-index:1;padding-bottom:80px;}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(var(--bgr),0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.03em;}
.logo span:first-child{background:linear-gradient(135deg,var(--ac),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-date{color:#334155;font-size:11px;font-weight:500;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.streak-badge{background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3);border-radius:99px;padding:4px 10px;display:flex;align-items:center;gap:4px;color:#f97316;font-size:12px;font-weight:700;}
.add-btn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;border-radius:12px;width:38px;height:38px;color:white;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(var(--acr),0.5);line-height:1;}

/* Content */
.content{max-width:540px;margin:0 auto;padding:16px 14px 0;}

/* Tabs */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(var(--bgr),0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;padding:8px 0 20px;}
.tab-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 2px;position:relative;}
.tab-btn.active::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:linear-gradient(90deg,var(--ac),#a78bfa);border-radius:99px;}
.tab-icon{font-size:17px;}
.tab-label{font-size:10px;font-weight:600;color:#334155;font-family:inherit;}
.tab-btn.active .tab-label{color:var(--acs);}
.tab-btn:not(.active) .tab-icon{filter:grayscale(1) opacity(0.45);}

/* Cards */
.card{background:rgba(var(--cr),0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:18px;margin-bottom:12px;}
.card-title{color:#f1f5f9;font-weight:700;font-size:15px;margin-bottom:14px;}

/* Inputs */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{color:#94a3b8;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
.field-wrap{position:relative;display:flex;align-items:center;}
.field input,.field select{width:100%;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;color:#f1f5f9;font-size:15px;outline:none;font-family:inherit;transition:border-color 0.2s;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:rgba(var(--acr),0.8);}
.field .unit{position:absolute;right:12px;color:#475569;font-size:12px;font-weight:600;pointer-events:none;}
.field select{cursor:pointer;}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Buttons */
.btn{border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;letter-spacing:0.01em;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 14px rgba(var(--acr),0.4);}
.btn-orange{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 4px 14px rgba(249,115,22,0.4);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,0.3);}
.btn-ghost{background:rgba(255,255,255,0.05);color:#94a3b8;border:1px solid rgba(255,255,255,0.08)!important;}
.btn-danger{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)!important;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px;}
.btn-block{width:100%;padding:13px;}
.btn:disabled{background:rgba(255,255,255,0.05);color:#475569;box-shadow:none;cursor:not-allowed;}

/* Progress bar */
.progress-wrap{background:#1e293b;border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}

/* Macro pills */
.macro-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.macro-pill{border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:64px;}
.macro-val{font-size:15px;font-weight:700;}
.macro-label{font-size:11px;font-weight:500;color:#64748b;margin-top:1px;}

/* Meal section */
.meal-section{margin-bottom:0;}
.meal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.meal-name{color:#f1f5f9;font-weight:700;font-size:15px;}
.meal-meta{color:#475569;font-size:12px;margin-top:2px;}

/* Food item */
.food-item{background:rgba(30,41,59,0.4);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.food-name{color:#e2e8f0;font-weight:600;font-size:14px;}
.food-macros{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;}
.food-kcal{color:#f97316;font-size:12px;font-weight:700;}
.food-macro{color:#475569;font-size:12px;}
.food-actions{display:flex;gap:4px;flex-shrink:0;}

/* Meal pills */
.meal-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.meal-pill{padding:6px 14px;border-radius:99px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit;}
.meal-pill.active{background:rgba(var(--acr),0.3);color:var(--acs);}
.meal-pill:not(.active){background:rgba(30,41,59,0.6);color:#64748b;}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,6,23,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;}
.modal{background:rgba(var(--mr),0.99);border:1px solid rgba(255,255,255,0.1);border-radius:24px 24px 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 -20px 60px rgba(0,0,0,0.7);animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.modal-handle{display:flex;justify-content:center;padding:12px 0 0;}
.modal-handle-bar{width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:99px;}
.modal-header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.modal-title{color:#f1f5f9;font-size:18px;font-weight:700;}
.modal-close{background:rgba(255,255,255,0.08);border:none;color:#94a3b8;cursor:pointer;font-size:16px;width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.modal-body{padding:18px 20px 30px;}

/* Mode toggle */
.mode-toggle{display:flex;background:rgba(30,41,59,0.6);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;}
.mode-btn{flex:1;padding:8px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit;}
.mode-btn.active{background:rgba(var(--acr),0.3);color:var(--acs);}
.mode-btn:not(.active){background:transparent;color:#475569;}

/* Insight */
.insight{border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.insight-icon{font-size:16px;}
.insight-text{font-size:13px;font-weight:500;}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:rgba(var(--cr),0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:14px 16px;}
.stat-label{color:#64748b;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
.stat-value{font-size:24px;font-weight:800;margin-top:6px;}
.stat-unit{font-size:12px;color:#475569;font-weight:400;}

/* Bar chart */
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:130px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.bar-val{font-size:10px;color:#f97316;font-weight:700;height:14px;display:flex;align-items:center;}
.bar{width:100%;border-radius:5px 5px 0 0;transition:height 0.5s ease;min-height:4px;}
.bar-day{font-size:11px;color:#475569;font-weight:400;}
.bar-day.today{color:var(--acs);font-weight:700;}

/* Search input */
.search-wrap{margin-bottom:12px;}
.search-input{width:100%;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;color:#f1f5f9;font-size:15px;outline:none;font-family:inherit;}
.search-input:focus{border-color:rgba(var(--acr),0.8);}

/* Saved food item */
.saved-item{background:rgba(var(--cr),0.8);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Streak banner */
.streak-banner{background:linear-gradient(135deg,rgba(249,115,22,0.2),rgba(234,88,12,0.1));border:1px solid rgba(249,115,22,0.3);border-radius:16px;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}

/* Deficit card */
.deficit-card{background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.3);border-radius:14px;padding:10px 16px;text-align:center;}
.deficit-card.over{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);}

/* Weight history */
.weight-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);}

/* Quantity stepper */
.qty-stepper{display:flex;align-items:center;gap:0;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;}
.qty-btn{background:none;border:none;color:var(--acs);font-size:18px;font-weight:700;cursor:pointer;padding:4px 12px;font-family:inherit;transition:background 0.15s;line-height:1;}
.qty-btn:active{background:rgba(var(--acr),0.2);}
.qty-val{color:#f1f5f9;font-size:15px;font-weight:700;min-width:24px;text-align:center;}

@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* Upgrade styles */
.subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.subnav .meal-pill{flex-shrink:0;white-space:nowrap;}
.mrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.note{color:#64748b;font-size:12px;line-height:1.5;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#64748b;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
.kv span:first-child{color:#94a3b8;}
.kv span:last-child{font-weight:700;color:#f1f5f9;text-align:right;}
textarea.paste{width:100%;min-height:90px;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;color:#f1f5f9;font-size:16px;font-family:inherit;outline:none;resize:vertical;}
.btn:disabled{opacity:0.4;}
@media(min-width:768px){.content{max-width:720px;}.modal{max-width:560px;}.stats-grid.three{grid-template-columns:repeat(3,1fr);}}

/* ── Unified analytics (WHOOP-inspired) ── */
.a-bar{position:sticky;top:var(--hh,62px);z-index:50;margin:-16px -14px 12px;padding:10px 14px;background:rgba(var(--bgr),0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);}
.a-seg{display:flex;background:rgba(30,41,59,0.7);border-radius:14px;padding:3px;gap:2px;}
.a-seg button{flex:1;min-height:38px;border:none;border-radius:11px;background:transparent;color:#64748b;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,color .15s;}
.a-seg button.on{background:rgba(var(--acr),0.35);color:#e0e7ff;}
.a-seg.small{flex:0 0 auto;}
.a-seg.small button{min-height:32px;padding:0 12px;font-size:12px;}
.acard{background:rgba(var(--cr),0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07);border-radius:22px;padding:16px 16px 6px;margin-bottom:12px;scroll-margin-top:calc(var(--hh,62px) + 66px);}
.acard.hero{background:linear-gradient(160deg,rgba(var(--acr),0.2),rgba(var(--cr),0.85) 55%);padding-bottom:16px;}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:32px;}
.ac-title{background:none;border:none;color:#94a3b8;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;cursor:pointer;text-align:left;padding:6px 0;flex:1;}
.ac-tap{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ac-more-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:6px;background:none;border:none;border-top:1px solid rgba(255,255,255,0.06);color:var(--acs);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.chev{display:inline-block;transition:transform .2s;}.chev.up{transform:rotate(180deg);}
.ac-more{padding:4px 0 14px;animation:fadeIn .25s ease;}
.ac-more .card{background:transparent;border:0;padding:0;margin:12px 0 0;backdrop-filter:none;-webkit-backdrop-filter:none;}
.ac-more .card-title{font-size:13px;}
.sub-t{font-weight:700;font-size:13px;color:#f1f5f9;margin:16px 0 8px;}
.headline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.big{font-size:34px;font-weight:800;letter-spacing:-0.02em;color:#22d3ee;line-height:1.1;font-variant-numeric:tabular-nums;}
.big .stat-unit{font-size:13px;}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;}
.rings{display:flex;justify-content:space-around;gap:6px;margin:6px 0 14px;}
.ring{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
.ring-l{font-size:11px;font-weight:700;color:#e2e8f0;margin-top:2px;}
.ring-s{font-size:10px;color:#64748b;text-align:center;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{text-align:left;font-family:inherit;color:inherit;background:rgba(30,41,59,0.5);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:44px;}
.tile:active{background:rgba(51,65,85,0.6);}
.tile-v{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.tile-s{color:#64748b;font-size:11px;margin-top:2px;}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px;}
.mini div{background:rgba(30,41,59,0.45);border-radius:12px;padding:8px 8px;min-width:0;}
.mini span{display:block;color:#64748b;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini b{display:block;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.mr2{margin-bottom:12px;}
.mr2-t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#94a3b8;margin-bottom:5px;}
.mr2-t b{color:#f1f5f9;}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:6px;background:#1e293b;}
.split i{display:block;height:100%;}
.selday{margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(var(--acr),0.12);color:#c7d2fe;font-size:12.5px;}
.ptab .prow{display:grid;grid-template-columns:1.25fr 1fr 1fr 0.7fr;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12.5px;font-weight:600;color:#f1f5f9;font-variant-numeric:tabular-nums;}
.ptab .prow>span:nth-child(n+2){text-align:right;}
.ptab .pk{color:#94a3b8;font-weight:500;}
.ptab .ph{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
@media(min-width:560px){.mini{grid-template-columns:repeat(4,1fr);}}
@media(min-width:768px){.big{font-size:40px;}.tiles{grid-template-columns:repeat(4,1fr);}.mini b{font-size:15px;}}
.qty-in{width:46px;background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#f1f5f9;font-size:15px;font-weight:700;text-align:center;padding:6px 2px;font-family:inherit;outline:none;-moz-appearance:textfield;}
.qty-in:focus{border-color:rgba(var(--acr),0.8);}
.qty-stepper .qty-in{border:none;background:transparent;width:38px;border-radius:0;}

/* ══ THEMES ══ */
[data-theme=aurora]{--ac:#10b981;--ac2:#06b6d4;--acs:#6ee7b7;--acr:16,185,129;--bgr:2,16,15;--cr:6,30,32;--mr:5,25,28;--glow1:#064e3b;--glow2:#0c2a4a;--bg:#02100f;}
[data-theme=neon]{--ac:#ff2bd6;--ac2:#00e5ff;--acs:#ff9bf0;--acr:255,43,214;--bgr:7,2,15;--cr:20,8,34;--mr:16,6,28;--glow1:#3b0764;--glow2:#04202b;--bg:#07020f;}
[data-theme=solar]{--ac:#f97316;--ac2:#ef4444;--acs:#fdba74;--acr:249,115,22;--bgr:15,5,3;--cr:32,14,10;--mr:28,12,8;--glow1:#7c2d12;--glow2:#450a0a;--bg:#0f0503;}
[data-theme=space]{--ac:#7c3aed;--ac2:#22d3ee;--acs:#c4b5fd;--acr:124,58,237;--bgr:1,1,10;--cr:10,10,30;--mr:8,8,26;--glow1:#2e1065;--glow2:#082f49;--bg:#01010a;}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none;}
[data-theme=space] #fx,[data-theme=solar] #fx{display:block;}
[data-motion=off] #fx{display:none!important;}
[data-theme=aurora] body::before{content:'';position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(40% 30% at 20% 20%,rgba(16,185,129,.38),transparent 70%),radial-gradient(35% 30% at 80% 30%,rgba(6,182,212,.32),transparent 70%),radial-gradient(40% 35% at 50% 80%,rgba(139,92,246,.28),transparent 70%);filter:blur(34px);animation:aur 16s ease-in-out infinite alternate;}
@keyframes aur{to{transform:translate(5%,7%) rotate(9deg) scale(1.12);}}
[data-theme=neon] body::after{content:'';position:fixed;left:-50%;right:-50%;bottom:0;height:52vh;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,43,214,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.35) 1px,transparent 1px);background-size:48px 48px;transform:perspective(380px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);animation:gridmove 2.4s linear infinite;}
@keyframes gridmove{to{background-position:0 48px;}}
[data-motion=off] body::before,[data-motion=off] body::after{animation:none!important;}
[data-theme=neon] .card,[data-theme=neon] .acard,[data-theme=neon] .stat-card,[data-theme=neon] .tile{border-color:rgba(var(--acr),.32);box-shadow:0 0 20px rgba(var(--acr),.09),inset 0 0 24px rgba(var(--acr),.04);}
[data-theme=neon] .logo,[data-theme=neon] .big{text-shadow:0 0 14px rgba(var(--acr),.55);}
[data-theme=solar] .card,[data-theme=solar] .acard{border-color:rgba(var(--acr),.2);}
[data-theme=space] .card,[data-theme=space] .acard{border-color:rgba(var(--acr),.22);}
[data-theme=aurora] .card,[data-theme=aurora] .acard{border-color:rgba(var(--acr),.18);}
.logo span:first-child{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.tab-btn.active::before{background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 12px rgba(var(--acr),.8);}
.btn-primary{background:linear-gradient(135deg,var(--ac),var(--ac2));}
/* interactivity */
.card,.acard,.tile,.stat-card{position:relative;}
.card::after,.acard::after,.tile::after,.stat-card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(var(--acr),.16),transparent 62%);}
.card:hover::after,.acard:hover::after,.tile:hover::after,.stat-card:hover::after,.tile:active::after{opacity:1;}
.btn,.a-seg button,.mode-btn,.meal-pill,.ac-more-btn,.tab-btn{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(var(--acr),.45);transform:scale(0);animation:rip .6s ease-out forwards;}
@keyframes rip{to{transform:scale(1);opacity:0;}}
.tilt{transition:transform .18s ease;}
.tile:active,.btn:active{transform:scale(.97);}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:none;}}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes ringIn{from{stroke-dasharray:0 999;}}
.ring circle:nth-child(2){animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1);}
[data-motion=off] .enter>*,[data-motion=off] .ring circle{animation:none!important;}
@media(prefers-reduced-motion:reduce){.enter>*,.ring circle,body::before,body::after{animation:none!important;}#fx{display:none!important;}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:3000;pointer-events:none;}
.th-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;color:#f1f5f9;background:rgba(30,41,59,.5);border:2px solid rgba(255,255,255,.08);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer;min-height:64px;}
.th-card.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(var(--acr),.2);}
.th-sw{width:64px;height:48px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;}
.th-sw i{position:absolute;border-radius:50%;}
.th-n{font-weight:700;font-size:15px}.th-d{font-size:12px;color:#94a3b8;margin-top:2px}
.th-sw-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;font-size:14px;font-weight:600;}
.sw{width:46px;height:28px;border-radius:99px;background:#334155;border:none;position:relative;cursor:pointer;transition:background .2s;}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;}
.sw.on{background:var(--ac);}.sw.on::after{transform:translateX(18px);}
.theme-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
</style>

</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="logo"><span>Fuel</span><span style="color:#f1f5f9">Track</span></div>
      <div class="logo-date" id="headerDate"></div>
    </div>
    <div class="header-right">
      <button class="theme-btn" onclick="openThemes()" aria-label="Themes">🎨</button>
      <div class="streak-badge" id="streakBadge" style="display:none">🔥 <span id="streakNum">0</span></div>
      <button class="add-btn" onclick="openAddModal()">+</button>
    </div>
  </div>

  <!-- Content -->

  <div class="content" id="mainContent"></div>

  <!-- Tab Bar -->

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('dashboard',this)" id="tab-dashboard">
      <span class="tab-icon">⚡</span><span class="tab-label">Dashboard</span>
    </button>
    <button class="tab-btn" onclick="switchTab('log',this)" id="tab-log">
      <span class="tab-icon">📋</span><span class="tab-label">Log</span>
    </button>
    <button class="tab-btn" onclick="switchTab('saved',this)" id="tab-saved">
      <span class="tab-icon">⭐</span><span class="tab-label">Saved</span>
    </button>
    <button class="tab-btn" onclick="switchTab('calc',this)" id="tab-calc">
      <span class="tab-icon">🔢</span><span class="tab-label">Calc</span>
    </button>
    <button class="tab-btn" onclick="switchTab('analytics',this)" id="tab-analytics">
      <span class="tab-icon">📊</span><span class="tab-label">Analytics</span>
    </button>
    <button class="tab-btn" onclick="switchTab('goals',this)" id="tab-goals">
      <span class="tab-icon">🎯</span><span class="tab-label">Goals</span>
    </button>
  </div>
</div>

<!-- Modal Container -->

<div id="modalContainer"></div>

<script>
// ── STATE ──
const S = {
  entries: load('ft_entries', []),
  saved: load('ft_saved', []),
  goals: load('ft_goals', {calories:2000, protein:150}),
  streak: load('ft_streak', 0),
  lastDate: load('ft_lastDate', ''),
  currentTab: 'dashboard',
  modalMeal: 'Breakfast',
};

const DEFAULT_FOODS = [
  {id:'df1',name:'Roti',calories:80,protein:2.5,carbs:15,fats:1.5},
  {id:'df2',name:'Dal Tadka',calories:150,protein:9,carbs:22,fats:3},
  {id:'df3',name:'Paneer Sabji',calories:220,protein:14,carbs:8,fats:15},
  {id:'df4',name:'Whey Protein',calories:120,protein:24,carbs:3,fats:1.5},
  {id:'df5',name:'Lassi',calories:180,protein:6,carbs:28,fats:5},

  {id:'df6',name:'Tofu (100g)',calories:76,protein:8,carbs:2,fats:4.5},
  {id:'df6b',name:'Rajma (1 cup)',calories:225,protein:15,carbs:40,fats:1},
  {id:'df16',name:'Amul Protein Lassi',calories:107,protein:15,carbs:12,fats:1.7},
  {id:'df17',name:'Soya Chunks (50g)',calories:170,protein:26,carbs:15,fats:1},
  {id:'df18',name:'Chataka Pataka (10₹)',calories:247,protein:3,carbs:30,fats:12},
  {id:'df19',name:'Masala Bhakhri',calories:600,protein:10,carbs:75,fats:27},
  {id:'df20',name:'5 Thepla',calories:450,protein:10,carbs:60,fats:15},
  {id:'df21',name:'Jeera Rice + Dal Fry (250g each)',calories:650,protein:18,carbs:100,fats:20},
  {id:'df22',name:'1.5 Masala Dosa',calories:380,protein:8,carbs:60,fats:12},
  {id:'df23',name:'Ritebite Bar',calories:286,protein:10,carbs:30,fats:14},
  {id:'df8',name:'Oats (50g)',calories:188,protein:6.5,carbs:32,fats:3.5},
  {id:'df9',name:'Banana',calories:89,protein:1.1,carbs:23,fats:0.3},
  {id:'df10',name:'Eggs (2)',calories:148,protein:12,carbs:1,fats:10},
  {id:'df11',name:'Dahi (100g)',calories:61,protein:3.5,carbs:4.7,fats:3.3},
  {id:'df12',name:'Mixed Veg Curry',calories:130,protein:4,carbs:18,fats:5},
  {id:'df13',name:'Idli (2 pcs)',calories:130,protein:4,carbs:26,fats:0.5},
  {id:'df14',name:'Sambar (1 cup)',calories:100,protein:4,carbs:16,fats:2},
  {id:'df15',name:'Curd Rice',calories:200,protein:5,carbs:38,fats:3},
];

const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
function foodList() { return [...DEFAULT_FOODS.filter(f=>!(S.hidden||[]).includes(f.id)), ...S.saved]; }

function load(k, fb) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; }
}
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}
function persist() {
  save('ft_entries', S.entries);
  save('ft_saved', S.saved);
  save('ft_goals', S.goals);
  save('ft_streak', S.streak);
  save('ft_lastDate', S.lastDate);
  save('ft_waist', S.waist);
  save('ft_hidden_foods', S.hidden);
}
function genId() { return Math.random().toString(36).slice(2,9); }
function today() { return fmtLocal(new Date()); }
function clamp(v,a,b) { return Math.min(Math.max(v,a),b); }
function todayEntries() { return S.entries.filter(e => dateOf(e.timestamp) === today()); }
function totals(entries) {
  return entries.reduce((a,e) => ({calories:a.calories+e.calories,protein:a.protein+e.protein,carbs:a.carbs+e.carbs,fats:a.fats+e.fats}),{calories:0,protein:0,carbs:0,fats:0});
}

// ── STREAK ──
function updateStreak() {
  const t = today();
  const te = todayEntries();
  if (te.length > 0 && S.lastDate !== t) {
    const yd = new Date(); yd.setDate(yd.getDate()-1);
    const yds = fmtLocal(yd);
    S.streak = S.lastDate === yds ? S.streak + 1 : 1;
    S.lastDate = t;
    persist();
  }
  checkCelebrate();
}

// ── HEADER ──
function initHeader() {
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  updateStreakUI();
}
function updateStreakUI() {
  const b = document.getElementById('streakBadge');
  const n = document.getElementById('streakNum');
  if (S.streak > 0) { b.style.display='flex'; n.textContent = S.streak; }
  else { b.style.display='none'; }
}

// ── TABS ──
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  // Re-activate correct button if btn not passed
  const tabBtn = btn || document.getElementById('tab-'+name);
  if(tabBtn) tabBtn.classList.add('active');
  S.currentTab = name;
  render();
  enterAnim();
}

function render() {
  const c = document.getElementById('mainContent');
  if (S.currentTab === 'dashboard') c.innerHTML = renderDashboard();
  else if (S.currentTab === 'log') c.innerHTML = renderLog();
  else if (S.currentTab === 'saved') c.innerHTML = renderSaved();
  else if (S.currentTab === 'calc') c.innerHTML = renderCalc();
  else if (S.currentTab === 'analytics') c.innerHTML = renderAnalytics();
  else if (S.currentTab === 'goals') c.innerHTML = renderGoals();
}

// ── PROGRESS BAR HTML ──
function progressBarHTML(value, max, color, height=8) {
  const pct = max > 0 ? clamp((value/max)*100, 0, 110) : 0;
  const over = pct > 100;
  const bg = over ? 'linear-gradient(90deg,#ef4444,#f97316)' : `linear-gradient(90deg,${color}cc,${color})`;
  return `<div class="progress-wrap" style="height:${height}px"><div class="progress-bar" style="width:${Math.min(pct,100)}%;background:${bg};box-shadow:0 0 10px ${color}55;height:100%"></div></div>`;
}

function macroPillHTML(label, value, color, unit='g') {
  return `<div class="macro-pill" style="background:${color}18;border:1px solid ${color}40"><span class="macro-val" style="color:${color}">${Math.round(value)}${unit}</span><span class="macro-label">${label}</span></div>`;
}

function foodItemHTML(e) {
  return `<div class="food-item">
    <div style="flex:1">
      <div class="food-name">${esc(e.name)}</div>
      <div class="food-macros">
        <span class="food-kcal">${e.calories} kcal</span>
        <span class="food-macro">P:${e.protein}g · C:${e.carbs}g · F:${e.fats}g</span>
      </div>
    </div>
    <div class="food-actions">
      <button class="btn btn-sm btn-ghost" data-id="${e.id}" onclick="editEntry(this.dataset.id)">✏️</button>
      <button class="btn btn-sm btn-danger" data-id="${e.id}" onclick="deleteEntry(this.dataset.id)">✕</button>
    </div>
  </div>`;
}

// ── DASHBOARD ──
function renderDashboard() {
  const te = todayEntries();
  const t = totals(te);
  const goalCal = S.goals.calories || 2000;
  const goalProt = S.goals.protein || 150;
  const remaining = goalCal - t.calories;

  let html = '';

  // Streak
  if (S.streak > 0) html += `<div class="streak-banner"><span style="font-size:22px">🔥</span><div><div style="color:#f97316;font-weight:700;font-size:14px">${S.streak} Day Streak!</div><div style="color:#64748b;font-size:12px">Keep logging daily</div></div></div>`;

  // Calorie card
  html += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="color:#64748b;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Today's Calories</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px">
          <span style="color:#f97316;font-size:38px;font-weight:800;line-height:1">${Math.round(t.calories)}</span>
          <span style="color:#475569;font-size:15px">/ ${goalCal} kcal</span>
        </div>
      </div>
      <div class="${remaining>0?'deficit-card':'deficit-card over'}">
        <div style="color:${remaining>0?'#22d3ee':'#f87171'};font-size:20px;font-weight:800">${Math.abs(Math.round(remaining))}</div>
        <div style="color:#475569;font-size:11px;font-weight:600">${remaining>0?'remaining':'over'}</div>
      </div>
    </div>
    ${progressBarHTML(t.calories, goalCal, '#f97316', 10)}
    <div class="macro-pills">
      ${macroPillHTML('Protein',t.protein,'#22d3ee')}
      ${macroPillHTML('Carbs',t.carbs,'#a78bfa')}
      ${macroPillHTML('Fats',t.fats,'#fb7185')}
    </div>
  </div>`;

  // Protein bar
  html += `<div class="card" style="padding:14px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="color:#f1f5f9;font-weight:600;font-size:14px">Protein Goal</span>
      <span style="color:#22d3ee;font-size:13px;font-weight:700">${Math.round(t.protein)}g / ${goalProt}g</span>
    </div>
    ${progressBarHTML(t.protein, goalProt, '#22d3ee', 8)}
  </div>`;

  // Insights
  if (t.protein < goalProt*0.5 && te.length > 0) html += insightHTML('⚠️','Protein intake is low today','#fbbf24');
  if (t.calories > goalCal*1.1) html += insightHTML('🔥','You exceeded your calorie goal','#f87171');
  if (remaining > 0 && t.calories > goalCal*0.8) html += insightHTML('✅','Almost at your calorie goal!','#34d399');
  if (te.length === 0) html += insightHTML('📝','Start logging your meals today','#a78bfa');

  // Add button
  html += `<button class="btn btn-primary btn-block" onclick="openAddModal()" style="margin-bottom:12px">＋ Add Food</button>`;

  // Meals
  MEALS.forEach(meal => {
    const items = te.filter(e => e.meal === meal);
    const mc = items.reduce((s,e)=>s+e.calories,0);
    html += `<div class="card">
      <div class="meal-header">
        <div>
          <div class="meal-name">${meal}</div>
          <div class="meal-meta">${items.length} items${mc>0?' · '+Math.round(mc)+' kcal':''}</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="openAddModal('${meal}')">+ Add</button>
      </div>
      ${items.map(e=>foodItemHTML(e)).join('')}
    </div>`;
  });

  return html;
}

function insightHTML(icon, msg, color) {
  return `<div class="insight" style="background:${color}10;border:1px solid ${color}25"><span class="insight-icon">${icon}</span><span class="insight-text" style="color:${color}">${msg}</span></div>`;
}

// ── LOG TAB ──
function renderLog() {
  const grouped = {};
  S.entries.forEach(e => {
    const d = dateOf(e.timestamp);
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(e);
  });
  const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a));

  let html = `<button class="btn btn-primary btn-block" onclick="openAddModal()" style="margin-bottom:12px">＋ Log Food</button>`;

  if (dates.length === 0) {
    html += `<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:44px">🍽️</div><div style="color:#475569;margin-top:12px;font-size:15px">No entries yet. Start logging!</div></div>`;
    return html;
  }

  dates.forEach(date => {
    const dayE = grouped[date];
    const dTotal = dayE.reduce((s,e)=>s+e.calories,0);
    const isToday = date === today();
    const label = isToday ? 'Today' : new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="color:#f1f5f9;font-weight:700">${label}</div>
        <span style="color:#f97316;font-weight:700">${Math.round(dTotal)} kcal</span>
      </div>
      ${dayE.map(e=>foodItemHTML(e)).join('')}
    </div>`;
  });

  return html;
}

// ── SAVED TAB ──
function renderSaved() {
  const allFoods = foodList();
  let html = `
  <div style="display:flex;gap:10px;margin-bottom:12px">
    <div style="flex:1"><input class="search-input" id="savedSearch" oninput="filterSaved()" placeholder="Search foods..."/></div>
    <button class="btn btn-primary" onclick="toggleSaveForm()">＋ Save</button>
  </div>
  <div id="saveForm" style="display:none" class="card">
    <div class="card-title">Save New Food</div>
    <div class="field"><label>Food Name</label><div class="field-wrap"><input id="sf_name" type="text" placeholder="e.g. Protein Bar"/></div></div>
    <div class="grid2">
      <div class="field"><label>Calories</label><div class="field-wrap"><input id="sf_cal" type="number" placeholder="0"/><span class="unit">kcal</span></div></div>
      <div class="field"><label>Protein</label><div class="field-wrap"><input id="sf_prot" type="number" placeholder="0"/><span class="unit">g</span></div></div>
      <div class="field"><label>Carbs</label><div class="field-wrap"><input id="sf_carbs" type="number" placeholder="0"/><span class="unit">g</span></div></div>
      <div class="field"><label>Fats</label><div class="field-wrap"><input id="sf_fats" type="number" placeholder="0"/><span class="unit">g</span></div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveNewFood()">Save Food</button>
  </div>
  <div style="color:#475569;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px">${allFoods.length} Foods Available</div>
  <div id="savedList">`;

  allFoods.forEach(food => {
    html += savedFoodHTML(food);
  });

  html += `</div>`;
  return html;
}

function savedFoodHTML(food) {
  const isDefault = DEFAULT_FOODS.find(d=>d.id===food.id);
  return `<div class="saved-item">
    <div style="flex:1">
      <div style="color:#f1f5f9;font-weight:600;font-size:14px">${esc(food.name)}</div>
      <div class="food-macros" style="margin-top:4px">
        <span class="food-kcal">${food.calories} kcal</span>
        <span class="food-macro">P:${food.protein}g C:${food.carbs}g F:${food.fats}g</span>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <input class="qty-in" type="number" inputmode="numeric" min="1" max="99" value="1" id="sq_${food.id}" onfocus="this.select()" aria-label="Quantity"/>
      <button class="btn btn-sm btn-primary" onclick="quickAddFood('${food.id}')">Add</button>
      <button class="btn btn-sm btn-ghost" data-id="${food.id}" onclick="editSavedFood(this.dataset.id)">✏️</button>
      <button class="btn btn-sm btn-danger" data-id="${food.id}" onclick="deleteSaved(this.dataset.id)">✕</button>
    </div>
  </div>`;
}

function filterSaved() {
  const q = document.getElementById('savedSearch').value.toLowerCase();
  const all = foodList();
  const filtered = all.filter(f=>f.name.toLowerCase().includes(q));
  document.getElementById('savedList').innerHTML = filtered.map(f=>savedFoodHTML(f)).join('');
}

function toggleSaveForm() {

// ── WEEK HELPERS ──
// Get Monday of the current week, then offset by N weeks
function getWeekMonday(weekOffset) {
  const d = new Date();
  const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diffToMonday = (day === 0) ? -6 : 1 - day; // days to go back to Monday
  d.setDate(d.getDate() + diffToMonday + (weekOffset * 7));
  d.setHours(0,0,0,0);
  return d;
}

function getWeekDays(weekOffset) {
  const monday = getWeekMonday(weekOffset);
  return Array.from({length:7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    return fmtLocal(d);
  });
}

function setModalMode(mode) { modalMode = mode; renderModal(); }
function setModalMeal(meal) { modalMeal = meal; renderModal(); }
function closeModal() {
  modalCart = []; // clear cart on close
  document.getElementById('modalContainer').innerHTML = '';
}

function addToCart(id) {
  const all = foodList();
  const food = all.find(f=>f.id===id);
  if(!food) return;
  const qtyEl = document.getElementById('qty_'+id);
  const qty = qtyEl ? clamp(parseInt(qtyEl.value!==undefined?qtyEl.value:qtyEl.textContent)||1,1,99) : 1;
  // If already in cart, update qty
  const existing = modalCart.findIndex(c=>c.id===id);
  if(existing >= 0) {
    modalCart[existing].qty += qty;
    modalCart[existing].calories = Math.round(food.calories * modalCart[existing].qty);
    modalCart[existing].protein = Math.round(food.protein * modalCart[existing].qty * 10)/10;
    modalCart[existing].carbs = Math.round(food.carbs * modalCart[existing].qty * 10)/10;
    modalCart[existing].fats = Math.round(food.fats * modalCart[existing].qty * 10)/10;
  } else {
    modalCart.push({
      id: food.id,
      name: food.name,
      qty,
      calories: Math.round(food.calories * qty),
      protein: Math.round(food.protein * qty * 10)/10,
      carbs: Math.round(food.carbs * qty * 10)/10,
      fats: Math.round(food.fats * qty * 10)/10,
    });
  }
  renderModal();
}

function removeFromCart(idx) {
  modalCart.splice(idx, 1);
  renderModal();
}

function clearCart() {
  modalCart = [];
  renderModal();
}

function addCartToMeal() {
  if(modalCart.length === 0) return;
  const logDate = document.getElementById('modal_date')?.value || modalDate || today();
  const timestamp = new Date(logDate + 'T12:00:00').getTime();
  modalCart.forEach(item => {
    S.entries.push({
      id: genId(),
      name: item.qty > 1 ? `${item.name} ×${item.qty}` : item.name,
      calories: item.calories,
      protein: item.protein,
      carbs: item.carbs,
      fats: item.fats,
      meal: modalMeal,
      timestamp
    });
  });
  persist();
  updateStreak();
  updateStreakUI();
  modalCart = [];
  closeModal();
  render();
}

function changeManualQty(delta) {
  const el = document.getElementById('manual_qty');
  if(!el) return;
  let v = parseInt(el.textContent) + delta;
  if(v < 1) v = 1;
  if(v > 20) v = 20;
  el.textContent = v;
  // Update live preview
  const cal = parseFloat(document.getElementById('m_cal').value) || 0;
  const prev = document.getElementById('manual_preview');
  if(prev && cal > 0) prev.textContent = `= ${Math.round(cal * v)} kcal`;
  else if(prev) prev.textContent = '';
}

function submitAdd() {
  const name = document.getElementById('m_name').value;
  const cal = parseFloat(document.getElementById('m_cal').value);
  if(!name || !cal) return;
  const qty = parseInt(document.getElementById('manual_qty')?.textContent) || 1;
  // Use selected date at noon to avoid timezone issues
  const logDate = document.getElementById('modal_date')?.value || today();
  const timestamp = new Date(logDate + 'T12:00:00').getTime();
  S.entries.push({
    id: genId(),
    name: qty > 1 ? `${name} ×${qty}` : name,
    calories: Math.round(cal * qty),
    protein: Math.round((parseFloat(document.getElementById('m_prot').value)||0) * qty * 10) / 10,
    carbs: Math.round((parseFloat(document.getElementById('m_carbs').value)||0) * qty * 10) / 10,
    fats: Math.round((parseFloat(document.getElementById('m_fats').value)||0) * qty * 10) / 10,
    meal: modalMeal,
    timestamp
  });
  persist();
  updateStreak();
  updateStreakUI();
  closeModal();
  render();
}

function fillForm(id) {

  if(v > 99) v = 99;
  if(el.tagName==='INPUT') el.value = v; else el.textContent = v;

// ── Local calendar-date helpers (never use UTC for calendar dates) ──
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad2(n){return String(n).padStart(2,'0');}
function fmtLocal(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseDS(ds){const p=String(ds).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0);}
function dateOf(ts){return fmtLocal(new Date(ts));}
function addDays(ds,n){const d=parseDS(ds);d.setDate(d.getDate()+n);return fmtLocal(d);}
function daysBetween(a,b){return Math.round((parseDS(b)-parseDS(a))/86400000);}
function isValidDS(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmtLocal(parseDS(s))===s;}
function fmtShort(ds){return parseDS(ds).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtLong(ds){return parseDS(ds).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function mondayOf(ds){const dow=parseDS(ds).getDay();return addDays(ds,dow===0?-6:1-dow);}
function dateList(a,b){const r=[];let d=a,g=0;while(d<=b&&g++<4000){r.push(d);d=addDays(d,1);}return r;}
Number.prototype.fv=function(){const r=Math.round(this*100)/100;return Math.abs(r*10-Math.round(r*10))<1e-9?r.toFixed(1):r.toFixed(2);};
function sgn(v,dec){if(dec==null){const r=Math.round(Math.abs(v)*100)/100;return (r===0?'':v>0?'+':'−')+r.fv();}const f=Math.pow(10,dec);const r=Math.round(Math.abs(v)*f)/f;return (r===0?'':v>0?'+':'−')+r.toFixed(dec);}
function ensureIds(){
  let ch=false;
  (Array.isArray(S.goals.weightLog)?S.goals.weightLog:[]).forEach(function(e){if(e&&typeof e==='object'&&!e.id){e.id=genId();ch=true;}});
  S.waist.forEach(function(e){if(e&&typeof e==='object'&&!e.id){e.id=genId();ch=true;}});
  if(ch) persist();
}

// ── Measurement data (weight lives in S.goals.weightLog — unchanged key; waist in ft_waist) ──
function wLogRaw(){if(!Array.isArray(S.goals.weightLog))S.goals.weightLog=[];return S.goals.weightLog;}
function seriesFrom(arr,field){
  const m={};
  arr.forEach(function(e){
    if(!e||!isValidDS(e.date))return;
    const v=typeof e[field]==='number'?e[field]:parseFloat(e[field]);
    if(isFinite(v)) m[e.date]={date:e.date,v:v,id:e.id}; // last-entered entry wins per date
  });
  return Object.keys(m).sort().map(function(k){return m[k];});
}
function weightSeries(){return seriesFrom(wLogRaw(),'weight');}
function waistSeries(){return seriesFrom(S.waist,'waist');}
function rolling7(ser){
  return ser.map(function(p,i){
    let s=0,n=0;
    for(let j=i;j>=0;j--){if(daysBetween(ser[j].date,p.date)>6)break;s+=ser[j].v;n++;}
    return {date:p.date,v:s/n};
  });
}
function syncGoalWeight(){const s=weightSeries();if(s.length)S.goals.weight=s[s.length-1].v;}

const MCFG={
  weight:{label:'Weight',unit:'kg',field:'weight',min:20,max:400,get:function(){return wLogRaw();},set:function(a){S.goals.weightLog=a;}},
  waist:{label:'Waist',unit:'cm',field:'waist',min:30,max:250,get:function(){return S.waist;},set:function(a){S.waist=a;}}
};

function commitMeasure(kind,id,date,val){
  const c=MCFG[kind];
  if(!isValidDS(date))return 'Pick a valid date.';
  if(date>today())return 'Date cannot be in the future.';
  if(!isFinite(val))return 'Enter a number.';
  if(val<c.min||val>c.max)return c.label+' must be between '+c.min+' and '+c.max+' '+c.unit+'.';
  if(kind==='waist'&&val<45&&!confirm(val+' cm is very small — did you enter inches? Save anyway?'))return 'Not saved.';
  val=Math.round(val*100)/100;
  let arr=c.get().slice();
  const dups=arr.filter(function(x){return x&&x.date===date&&x.id!==id;});
  if(dups.length){
    const prev=dups[dups.length-1][c.field];
    if(!confirm('You already have a '+c.label.toLowerCase()+' entry for '+fmtLong(date)+' ('+prev+' '+c.unit+'). Replace '+(dups.length>1?'those entries':'it')+' with '+val+' '+c.unit+'?'))return 'Not saved (duplicate date).';
    arr=arr.filter(function(x){return !(x&&x.date===date&&x.id!==id);});
  }
  if(id){
    const i=arr.findIndex(function(x){return x&&x.id===id;});
    if(i<0)return 'Entry not found.';
    arr[i]=Object.assign({},arr[i],{date:date,[c.field]:val});
  } else arr.push({id:genId(),date:date,[c.field]:val});
  c.set(arr);
  if(kind==='weight')syncGoalWeight();
  persist();
  return null;
}
function logWeight(){
  const el=document.getElementById('w_input');
  const v=parseFloat(el.value);
  if(!v)return;
  const err=commitMeasure('weight',null,today(),v);
  if(err){if(err.indexOf('Not saved')!==0)alert(err);return;}
  render();
}
function deleteMeasure(kind,id){
  const c=MCFG[kind];
  const e=c.get().find(function(x){return x&&x.id===id;});
  if(!e)return;
  if(!confirm('Delete the '+c.label.toLowerCase()+' entry '+e[c.field]+' '+c.unit+' on '+fmtLong(e.date)+'?'))return;
  c.set(c.get().filter(function(x){return !(x&&x.id===id);}));
  if(kind==='weight')syncGoalWeight();
  persist();render();
}

function emptyCard(icon,title,sub){return `<div class="card" style="text-align:center;padding:30px 20px"><div style="font-size:34px">${icon}</div><div style="color:#94a3b8;margin-top:10px;font-size:14px;font-weight:600">${title}</div><div class="note" style="margin-top:6px">${sub||''}</div></div>`;}
function statCard(label,val,unit,color,sub){return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="color:${color};font-size:22px">${val}${unit?`<span class="stat-unit"> ${unit}</span>`:''}</div>${sub?`<div style="color:#475569;font-size:11px;margin-top:4px">${sub}</div>`:''}</div>`;}
function chgColor(v,kind){
  if(!isFinite(v)||Math.abs(v)<0.05)return '#94a3b8';
  const g=S.goals.goal;let good;
  if(kind==='waist')good=v<0;
  else if(g==='gain')good=v>0;

  else good=v<0;

function barChartSVG(items,o){

function saveTarget(){
  const v=parseFloat(document.getElementById('tw_input').value);
  if(!isFinite(v)||v<20||v>400){alert('Enter a target weight between 20 and 400 kg.');return;}
  S.goals.targetWeight=v;persist();render();
}
function clearTarget(){delete S.goals.targetWeight;persist();render();}
function computeProjection(){
  const tw=S.goals.targetWeight,ser=weightSeries();
  if(!tw)return {ok:false,reason:'Set a target weight to see a projection.'};
  if(!ser.length)return {ok:false,reason:'Log some weigh-ins first.'};
  const roll=rolling7(ser),cur=roll[roll.length-1].v,lastD=ser[ser.length-1].date;
  if(Math.abs(cur-tw)<0.3)return {ok:true,reached:true,cur:cur};
  const win=ser.filter(function(p){return daysBetween(p.date,lastD)<=89;}),span=daysBetween(win[0].date,lastD);
  if(win.length<4||span<21)return {ok:false,reason:'Not enough data to project: needs at least 4 weigh-ins spread over 3+ weeks within the last 90 days (you have '+win.length+' over '+span+' days).'};
  const stale=daysBetween(lastD,today());
  if(stale>14)return {ok:false,reason:'Your latest weigh-in is '+stale+' days old. Log a new one to get a current projection.'};
  const n=win.length,xs=win.map(function(p){return daysBetween(win[0].date,p.date);}),ys=win.map(function(p){return p.v;});
  const mx=xs.reduce(function(a,b){return a+b;},0)/n,my=ys.reduce(function(a,b){return a+b;},0)/n;
  let sxx=0,sxy=0;for(let i=0;i<n;i++){sxx+=(xs[i]-mx)*(xs[i]-mx);sxy+=(xs[i]-mx)*(ys[i]-my);}
  const b=sxy/sxx,a0=my-b*mx;let sse=0;for(let i=0;i<n;i++){const e=ys[i]-(a0+b*xs[i]);sse+=e*e;}
  const se=Math.sqrt(sse/(n-2)/sxx),need=tw-cur;
  if(b*need<=0)return {ok:false,reason:'Your recent trend ('+sgn(b*7,2)+' kg/week) is not heading toward '+tw+' kg, so no date can be estimated.'};
  const ab=Math.abs(b),days=Math.abs(need)/ab;
  if(days>1095)return {ok:false,reason:'At your recent rate ('+sgn(b*7,2)+' kg/week) the target is over 3 years away — too uncertain to project.'};
  const fast=Math.abs(need)/(ab+2*se),slowRate=ab-2*se,slow=slowRate>0?Math.abs(need)/slowRate:null;
  return {ok:true,cur:cur,perWeek:b*7,n:n,span:span,need:need,eta:addDays(lastD,Math.ceil(days)),etaFast:addDays(lastD,Math.ceil(fast)),etaSlow:slow!=null&&slow<=1825?addDays(lastD,Math.ceil(slow)):null,uncertain:slow==null||slow>1825};
}
function projectionCardHTML(){

  let body='';
  if(tw&&p.ok&&p.reached)body=`<div class="insight" style="background:#34d39910;border:1px solid #34d39925"><span class="insight-text" style="color:#34d399">Your 7-day average (${p.cur.toFixed(1)} kg) is at your target. 🎯</span></div>`;

      out.saved.push(Object.assign({},f,{id:idOK(f.id)?f.id:genId(),protein:num(f.protein)?f.protein:0,carbs:num(f.carbs)?f.carbs:0,fats:num(f.fats)?f.fats:0}));

      if(g.weightLog!==undefined&&!Array.isArray(g.weightLog))errs.push('Weight history is not a list.');
      else if(Array.isArray(g.weightLog))g.weightLog.forEach(function(e,i){if(!e||typeof e!=='object')errs.push('Weight entry #'+(i+1)+' is malformed.');else if(!isValidDS(e.date)||!isFinite(parseFloat(e.weight)))warn++;});

    else{d.ft_waist.forEach(function(e,i){if(!e||typeof e!=='object')errs.push('Waist entry #'+(i+1)+' is malformed.');else if(!isValidDS(e.date)||!isFinite(parseFloat(e.waist)))warn++;});out.waist=d.ft_waist;}

function planMerge(p){
  const sig=function(e){return [e.timestamp,e.name,e.calories,e.meal].join('|');};
  const ids={},sigs={};S.entries.forEach(function(e){ids[e.id]=1;sigs[sig(e)]=1;});
  const newE=(p.entries||[]).filter(function(e){if(ids[e.id]||sigs[sig(e)])return false;ids[e.id]=1;sigs[sig(e)]=1;return true;});
  const sids={},snames={};S.saved.forEach(function(f){sids[f.id]=1;snames[f.name+'|'+f.calories]=1;});
  const newS=(p.saved||[]).filter(function(f){if(sids[f.id]||snames[f.name+'|'+f.calories])return false;sids[f.id]=1;return true;});
  const mk=function(cur,inc){const ds={};cur.forEach(function(e){if(e&&e.date)ds[e.date]=1;});return (inc||[]).filter(function(e){if(!e||!e.date||ds[e.date])return false;ds[e.date]=1;return true;});};

function handleRestoreText(text){

    return;
  }

    ${o.entries?row('Food entries',o.entries.length,m.entries.length):''}${o.saved?row('Saved foods',o.saved.length,m.saved.length):''}
    ${o.goals?row('Weight entries',(o.goals.weightLog||[]).length,m.weights.length):''}${o.waist?row('Waist entries',o.waist.length,m.waist.length):''}
    ${v.warn?`<div class="note" style="margin-top:8px">${v.warn} weight/waist entr${v.warn>1?'ies have':'y has'} unreadable values; they are kept but won't display.</div>`:''}
    <div class="note" style="margin:10px 0">Nothing has been changed yet. <b>Merge</b> adds only entries you don't already have (existing weights/waist on the same date, goals and settings are kept). <b>Replace</b> overwrites this device's data with the backup — use it when setting up a new device. A safety copy of your current data is saved first either way.</div>

}

function onRestoreFile(inp){

function checkPasted(){const t=document.getElementById('bk_paste').value.trim();if(!t){bkMsg('Paste your backup JSON first.',false);return;}handleRestoreText(t);}
function applyRestore(mode){
  if(!pendingRestore)return;
  const p=pendingRestore;
  if(mode==='replace'&&!confirm('Replace ALL current data on this device with the backup? A safety copy of the current data is kept.'))return;
  try{localStorage.setItem('ft_prerestore_backup',JSON.stringify({savedAt:Date.now(),backup:buildBackup()}));}
  catch(e){if(!confirm('Could not store a safety copy of your current data (storage full?). Continue anyway?'))return;}
  let msg;
  if(mode==='replace'){
    if(p.entries)S.entries=p.entries;
    if(p.saved)S.saved=p.saved;
    if(p.goals)S.goals=Object.assign({calories:2000,protein:150},p.goals);
    if(p.waist)S.waist=p.waist;
    if(p.streak!==undefined)S.streak=p.streak;
    if(p.lastDate!==undefined)S.lastDate=p.lastDate;
    Object.keys(p.extra).forEach(function(k){try{localStorage.setItem(k,JSON.stringify(p.extra[k]));}catch(e){}});
    msg='Restore complete — data replaced. A safety copy of your previous data is kept on this device.';
  } else {
    const m=planMerge(p);
    m.entries.forEach(function(e){S.entries.push(e);});
    m.saved.forEach(function(f){S.saved.push(f);});
    const wl=wLogRaw().concat(m.weights);
    if(p.goals)S.goals=Object.assign({},p.goals,S.goals);
    S.goals.weightLog=wl;
    m.waist.forEach(function(e){S.waist.push(e);});
    if(p.streak!==undefined)S.streak=Math.max(S.streak||0,p.streak);
    if(p.lastDate&&p.lastDate>(S.lastDate||''))S.lastDate=p.lastDate;
    Object.keys(p.extra).forEach(function(k){try{if(localStorage.getItem(k)===null)localStorage.setItem(k,JSON.stringify(p.extra[k]));}catch(e){}});
    msg='Merged: '+m.entries.length+' food entries, '+m.saved.length+' saved foods, '+m.weights.length+' weights, '+m.waist.length+' waist entries added. Existing data was kept.';
  }
  ensureIds();syncGoalWeight();persist();updateStreakUI();
  pendingRestore=null;bkFlash=msg;render();
}

// Shared context: everything below derives from the same stored data, recomputed on every render
function aCtx(){
  const t=today(),dm=dayMap(),gc=S.goals.calories||2000,gp=S.goals.protein||150,tdee=S.goals.tdee>0?S.goals.tdee:null;
  const ws=weightSeries().filter(function(p){return p.date<=t;}),xs=waistSeries().filter(function(p){return p.date<=t;});

  let first=null;
  [foodKeys[0],ws[0]&&ws[0].date,xs[0]&&xs[0].date].forEach(function(d){if(d&&(!first||d<first))first=d;});
  const a=aRange?addDays(t,-(aRange-1)):(first||t);

}
function aAgg(c,a,b){

    avgCarb:n?sm(function(d){return d.carbs;})/n:null,avgFat:n?sm(function(d){return d.fats;})/n:null,

}

// ── 3. Energy balance ──
function estObsHTML(c){
  const tdee=c.tdee,dm=c.dm,wfull=c.ws,wroll=rolling7(wfull),wr=inRange(wfull,aRange);
  let cmp;
  if(wr.length>=2){
    const w0=wr[0].date,w1=wr[wr.length-1].date,win=dateList(w0,w1),wl=win.map(function(d){return dm[d];}).filter(Boolean);
    const net=wl.reduce(function(s,d){return s+(tdee-d.cal);},0),estKg=-net/7700,rm={};wroll.forEach(function(p){rm[p.date]=p.v;});
    const obs=rm[w1]-rm[w0],cover=wl.length/win.length;
    cmp=`${kvr('Window (first → last weigh-in)',fmtShort(w0)+' → '+fmtShort(w1)+' ('+win.length+' days)')}
      ${kvr('Calculated deficit (TDEE '+tdee+' − intake)',wl.length?fmtN(net)+' kcal':'no logs')}
      ${kvr('Est. body-fat change <em style="color:#64748b;font-style:normal">(estimate)</em>',wl.length?sgn(estKg,2)+' kg':'—')}
      ${kvr('Observed weight change (7-day avg)','<span style="color:'+chgColor(obs,'weight')+'">'+sgn(obs,2)+' kg</span>')}
      ${cover<0.6?`<div class="insight" style="background:#fbbf2410;border:1px solid #fbbf2425;margin-top:10px"><span class="insight-text" style="color:#fbbf24">Only ${wl.length} of ${win.length} days in this window have food logs, so the calculated deficit is incomplete.</span></div>`:''}
      ${win.length<14?`<div class="insight" style="background:#fbbf2410;border:1px solid #fbbf2425;margin-top:10px"><span class="insight-text" style="color:#fbbf24">Short window — water and glycogen shifts can dominate. Use 4+ weeks to compare.</span></div>`:''}`;
  }else cmp=`<div class="note">Needs at least two weigh-ins in this range to compare the calculated deficit with actual weight change.</div>`;
  return `<div style="margin-top:14px;font-weight:700;font-size:13px;color:#f1f5f9">Estimated vs observed</div>${cmp}
    <div class="note" style="margin-top:10px">Assumes ~7,700 kcal per kg and applies today's saved TDEE to every date. Unlogged days aren't counted. When the two disagree, trust the multi-week weight trend.</div>`;
}
function secEnergy(c,cur,prv){
  if(!c.foodKeys.length)return secCard('energy',{title:'Energy balance',body:noData('Log meals to see calories vs target and your estimated deficit.')});
  if(!cur.n)return secCard('energy',{title:'Energy balance',body:noData('Nothing logged in this range. Try a longer range.')});
  const t=c.t,a=c.fa,gc=c.gc,tdee=c.tdee;
  const cal=bucketSeries(a,t,c.dm,function(d){return d.cal;},'avg');
  const chart=barChartSVG(cal.items.map(function(i){return {label:i.label,v:i.v,color:i.v>gc*1.05?'#ef4444':'#f97316',tip:i.label+': '+Math.round(i.v||0)+' kcal'+(i.n>1?' (avg of '+i.n+' logged days)':'')};}),{target:gc,w:CH.w,fs:CH.fs,h:160});
  const defAvg=tdee?tdee-cur.avgCal:null;
  const body=`<div class="headline"><div class="big" style="color:#f97316">${fmtN(cur.avgCal)}<span class="stat-unit"> kcal avg / day</span></div>${prv&&prv.n?dchip(cur.avgCal,prv.avgCal,0,'',0):''}</div>
    ${chartOrNone(chart)}
    <div class="legend"><span><i style="background:#f97316"></i>At/under target</span><span><i style="background:#ef4444"></i>Over +5%</span><span><i style="background:#a78bfa"></i>Target ${gc}</span>${cal.daily?'':'<span>Weekly averages</span>'}</div>
    ${miniRow([['Target',gc+' kcal','#a78bfa'],['Avg / day',fmtN(cur.avgCal)+' kcal','#f97316'],[defAvg!=null&&defAvg<0?'Est. surplus':'Est. deficit',defAvg!=null?fmtN(Math.abs(defAvg))+'/day':'—',defAvg==null?'#64748b':defAvg>=0?'#34d399':'#f87171'],['On target',cur.calOK+'/'+cur.n+' days','#34d399']])}
    ${tdee?'':'<div class="note" style="margin-top:6px">Deficit estimates need your TDEE — run the Calc tab once to save it.</div>'}`;
  let detail='';
  if(tdee){
    const a30=daysBetween(a,t)+1>30?addDays(t,-29):a;
    const dd=bucketSeries(a30,t,c.dm,function(d){return tdee-d.cal;},'sum');
    detail+=`<div class="sub-t">Estimated daily deficit / surplus <span class="note">(last ${daysBetween(a30,t)+1} days)</span></div>${chartOrNone(barChartSVG(dd.items.map(function(i){return {label:i.label,v:i.v,color:i.v>=0?'#34d399':'#f87171',tip:i.label+': '+sgn(i.v||0,0)+' kcal'};}),{signed:true,w:CH.w,fs:CH.fs,h:150}))}
      <div class="legend"><span><i style="background:#34d399"></i>Deficit (TDEE − intake)</span><span><i style="background:#f87171"></i>Surplus</span></div>`;
    const wk=bucketSeries(a,t,c.dm,function(d){return tdee-d.cal;},'sum',true);
    detail+=`<div class="sub-t">Weekly deficit / surplus <span class="note">(logged days only)</span></div>${chartOrNone(barChartSVG(wk.items.map(function(i){return {label:i.label,v:i.v,color:i.v>=0?'#34d399':'#f87171',tip:'Week of '+i.label+': '+sgn(i.v||0,0)+' kcal over '+i.n+' logged day(s)'};}),{signed:true,w:CH.w,fs:CH.fs,h:150}))}
      <div class="note">A week with few logged days shows a smaller total, not a smaller deficit.</div>`;
  }

  while(d<=te){const ma=fmtLocal(d),me=fmtLocal(new Date(d.getFullYear(),d.getMonth()+1,0,12));ms.push({ma:ma<a?a:ma,mb:me>t?t:me,label:d.toLocaleDateString('en-US',{month:'short',year:'numeric'})});d=new Date(d.getFullYear(),d.getMonth()+1,1,12);}
  const rows=ms.slice(-12).reverse().map(function(m){const g=aAgg(c,m.ma,m.mb);return g.n?kvr(m.label,fmtN(g.avgCal)+' kcal avg'+(tdee?' · <span style="color:'+(g.net>=0?'#34d399':'#f87171')+'">'+sgn(g.net,0)+'</span> est.':'')+' <span style="color:#64748b;font-weight:500">· '+g.n+' days</span>'):'';}).join('');
  detail+=`<div class="sub-t">Monthly trend <span class="note">(within selected range)</span></div>${rows||noData('No monthly data.')}`;
  if(tdee)detail+=estObsHTML(c);

}

  const body=`<div class="headline"><div class="big" style="color:#22d3ee">${fmtN(cur.avgProt)}<span class="stat-unit"> g protein avg</span></div>${prv&&prv.n?dchip(cur.avgProt,prv.avgProt,0,' g',1):''}</div>

    <div class="split"><i style="width:${pp.toFixed(1)}%;background:#22d3ee"></i><i style="width:${cp.toFixed(1)}%;background:#fbbf24"></i><i style="width:${fp.toFixed(1)}%;background:#c084fc"></i></div>
    <div class="legend"><span><i style="background:#22d3ee"></i>Protein ${Math.round(pp)}%</span><span><i style="background:#fbbf24"></i>Carbs ${Math.round(cp)}%</span><span><i style="background:#c084fc"></i>Fats ${Math.round(fp)}%</span></div>`;

  };

    +mk('Carbs',function(d){return d.carbs;},'#fbbf24',null,'')+mk('Fats',function(d){return d.fats;},'#c084fc',null,'')
    +`<div class="note" style="margin-top:10px">Only protein has a goal in FuelTrack, so carbs and fats show averages and share of calories only. The split uses 4/4/9 kcal per gram — an estimate that can differ from the calories on each entry.</div>`;

// ── 5. Consistency ──
function streaks(dm,t){
  const keys=Object.keys(dm).sort();let longest=0,run=0,prev=null;
  keys.forEach(function(k){run=prev&&daysBetween(prev,k)===1?run+1:1;if(run>longest)longest=run;prev=k;});
  let cur=0,d=dm[t]?t:addDays(t,-1);while(dm[d]){cur++;d=addDays(d,-1);}
  return {cur:cur,longest:longest};
}
function secConsistency(c,cur){
  if(!c.foodKeys.length)return secCard('consistency',{title:'Consistency',body:noData('Days with at least one food entry will light up here.')});
  const dm=c.dm,t=c.t,gc=c.gc,COLS=clamp(Math.ceil(c.days/7)+1,6,26),gap=3,L=26,T=16;
  const cell=Math.min(26,Math.floor((CH.w-L)/COLS-gap)),W=L+COLS*(cell+gap),H=T+7*(cell+gap);
  const startMon=addDays(mondayOf(t),-(COLS-1)*7);
  let s='',lastM=-1;
  [['Mon',0],['Wed',2],['Fri',4]].forEach(function(x){s+=`<text x="0" y="${T+x[1]*(cell+gap)+Math.min(cell-3,12)}" fill="${AXC}" font-size="9">${x[0]}</text>`;});
  for(let col=0;col<COLS;col++){
    const cs=addDays(startMon,col*7),m=parseDS(cs).getMonth();
    if(m!==lastM){const skip=col===0&&parseDS(addDays(cs,7)).getMonth()!==m;if(!skip)s+=`<text x="${L+col*(cell+gap)}" y="10" fill="${AXC}" font-size="9">${parseDS(cs).toLocaleDateString('en-US',{month:'short'})}</text>`;lastM=m;}
    for(let r=0;r<7;r++){
      const d=addDays(cs,r);if(d>t)continue;
      const e=dm[d],inR=d>=c.a;
      const fill=e?(e.cal<=gc*1.05?'#34d399':'#f97316'):'rgba(255,255,255,0.07)';
      s+=`<rect x="${L+col*(cell+gap)}" y="${T+r*(cell+gap)}" width="${cell}" height="${cell}" rx="3" fill="${fill}" opacity="${inR?(e?0.9:1):0.28}" ${d===aSelDay?'stroke="#fff" stroke-width="2"':d===t?'stroke="#a5b4fc" stroke-width="1.5"':''} style="cursor:pointer" onclick="event.stopPropagation();selDay('${d}')"><title>${fmtLong(d)}: ${e?Math.round(e.cal)+' kcal':'nothing logged'}</title></rect>`;
    }
  }
  const sk=streaks(dm,t),foodDays=daysBetween(c.fa,t)+1;
  const logged=dateList(c.fa,t).filter(function(d){return dm[d];}).length;
  let sel='';
  if(aSelDay){const e=dm[aSelDay];sel=`<div class="selday"><b>${parseDS(aSelDay).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b> — ${e?fmtN(e.cal)+' kcal · '+fmtN(e.prot)+' g protein · '+e.n+' item'+(e.n>1?'s':''):'nothing logged'}</div>`;}
  const body=`<div class="headline"><div class="big" style="color:#34d399">${logged}<span class="stat-unit"> of ${foodDays} days logged</span></div></div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;margin:6px auto 0" role="img" aria-label="Logging heatmap">${s}</svg>${sel}
    <div class="legend"><span><i style="background:#34d399"></i>Within goal</span><span><i style="background:#f97316"></i>Over goal</span><span><i style="background:rgba(255,255,255,0.12)"></i>Not logged</span><span>Dim = outside range</span></div>
    ${miniRow([['Logged',logged+'/'+foodDays,'#34d399'],['Rate',Math.round(logged/foodDays*100)+'%','#e2e8f0'],['Current streak',sk.cur+(sk.cur===1?' day':' days'),'#f97316'],['Longest',sk.longest+(sk.longest===1?' day':' days'),'#a78bfa']])}`;
  const wk=bucketSeries(c.fa,t,dm,function(){return 1;},'sum',true);
  const detail=`<div class="sub-t">Days logged per week</div>${chartOrNone(barChartSVG(wk.items.map(function(i){return {label:i.label,v:i.v==null?0:i.v,color:'#34d399',tip:'Week of '+i.label+': '+(i.v||0)+' day(s)'};}),{target:7,w:CH.w,fs:CH.fs,h:130}))}
    ${kvr('Days within calorie goal (≤ +5%)',aAgg(c,c.fa,t).calOK+' of '+logged)}
    <div class="note" style="margin-top:8px">Tap any square for that day. A day counts as logged if it has at least one food entry, so a partly logged day looks the same as a complete one. Current streak counts back from today (or yesterday if today is empty). Longest streak covers all records.</div>`;
  return secCard('consistency',{title:'Consistency',body:body,detail:detail});
}

// ── 7. Goal progress ──

  else{

      ${p.ok&&p.reached?`<div class="note" style="margin-top:8px;color:#34d399">Your 7-day average is at your target. 🎯</div>`:p.ok?`<div class="note" style="margin-top:8px">Possible target date <b style="color:#e2e8f0">${fmtLong(p.eta)}</b> <em style="color:#64748b;font-style:normal">(estimate, ${p.n} weigh-ins over ${p.span} days; see details for range &amp; assumptions)</em></div>`:`<div class="note" style="margin-top:8px;color:#fbbf24">${esc(p.reason)}</div>`}`;

// ── 8. Period summary (calendar week / month vs previous) ──
