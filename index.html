// Tracking categories only — NOT validated metabolic stages. Edit this array to change the bands.
const FAST_DAY_START_H=4; // food logged before 4 AM counts toward the previous eating day
const FAST_BANDS=[
  {id:'b0',min:0,   name:'Overnight fasting',        pat:null,       short:'<12h',color:'#64748b',ex:'A typical overnight gap between your last and first logged food. Not necessarily an intermittent-fasting schedule.'},
  {id:'b1',min:720, name:'12:12 pattern',            pat:'12:12',    short:'12h', color:'#38bdf8',ex:'About 12 hours between logged intake — in line with a 12-hour fasting / ~12-hour eating window.'},
  {id:'b2',min:840, name:'14:10 pattern',            pat:'14:10',    short:'14h', color:'#22d3ee',ex:'About 14 hours between logged intake — in line with a 14-hour fasting / ~10-hour eating window.'},
  {id:'b3',min:960, name:'16:8 pattern',             pat:'16:8',     short:'16h', color:'#818cf8',ex:'About 16 hours between logged intake — in line with a 16-hour fasting / ~8-hour eating window.'},
  {id:'b4',min:1080,name:'Extended daily fast',      pat:null,       short:'18h', color:'#a78bfa',ex:'A longer gap between logged intake. Shown for tracking only — a longer gap is not necessarily better.'},
  {id:'b5',min:1200,name:'Very long fasting interval',pat:null,      short:'20h', color:'#fbbf24',ex:'A very long gap between logged intake. Prolonged fasting is not suitable for everyone.',warn:true},
  {id:'b6',min:1440,name:'Prolonged fasting interval',pat:null,      short:'24h+',color:'#fb923c',ex:'A gap of 24 hours or more between logged intake. Shown for information only, not as a goal to extend.',warn:true}
];
const FAST_SAFETY='Categories are based only on gaps between your logged food. They are not verified fasts and not validated biological or metabolic stages, and a gap does not prove nothing was consumed. A longer gap is not a better one. Prolonged fasting is not suitable for everyone (for example if you are pregnant, under 18, have diabetes or a history of disordered eating, or take certain medicines) — please speak to a clinician before extending fasts.';
let aFastCat=null,aFastDay=null,aFastAll=false;
function selFastCat(id){aFastCat=aFastCat===id?null:id;aFastDay=null;aOpen.fasting=true;keepScroll(render);}
function selFastDay(d){aFastDay=aFastDay===d?null:d;aFastCat=null;keepScroll(render);}
function toggleFastAll(){aFastAll=!aFastAll;keepScroll(render);}
function bandOf(mins){let b=FAST_BANDS[0];FAST_BANDS.forEach(function(x){if(mins>=x.min)b=x;});return b;}
function bandIdx(b){return FAST_BANDS.indexOf(b);}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return h+'h '+pad2(mm)+'m';}
function fmtClock(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function fmtDT(ts){return fmtShort(dateOf(ts))+', '+fmtClock(ts);}
function eatDay(ts){return fmtLocal(new Date(ts-FAST_DAY_START_H*3600000));}
function median(a){if(!a.length)return null;const s=a.slice().sort(function(x,y){return x-y;}),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}

// Builds completed intervals (last intake of one eating day → first intake of the NEXT consecutive eating day),
// uncertain intervals (missing/untimed data) and the ongoing estimate. Zero-calorie entries are ignored.
function computeFasts(){
  const days={};let untimedEntries=0;
  S.entries.forEach(function(e){
    if(!e||!isFinite(e.timestamp)||!(+e.calories>0))return;
    const k=eatDay(e.timestamp),d=days[k]||(days[k]={date:k,evs:[],untimed:0});
    if(realTs(e))d.evs.push(e.timestamp);else{d.untimed++;untimedEntries++;}
  });
  const keys=Object.keys(days).sort();
  keys.forEach(function(k){const d=days[k];d.reliable=d.untimed===0&&d.evs.length>0;d.first=d.evs.length?Math.min.apply(null,d.evs):null;d.last=d.evs.length?Math.max.apply(null,d.evs):null;});
  const complete=[],uncertain=[];
  for(let i=1;i<keys.length;i++){
    const a=days[keys[i-1]],b=days[keys[i]],gap=daysBetween(a.date,b.date);
    if(gap===1&&a.reliable&&b.reliable&&b.first>a.last){
      const mins=(b.first-a.last)/60000;
      complete.push({start:a.last,end:b.first,mins:mins,endDay:b.date,band:bandOf(mins)});
    }else{
      const why=gap>1?'No food logged on '+(gap>2?(gap-1)+' days':'1 day')+' between '+fmtShort(a.date)+' and '+fmtShort(b.date)+', so the gap is unknown.':'Some entries on '+fmtShort(gap===1&&!a.reliable?a.date:b.date)+' have no recorded time.';
      uncertain.push({endDay:b.date,startDay:a.date,why:why});
    }
  }
  let ongoing=null;
  if(keys.length){
    const L=days[keys[keys.length-1]],now=Date.now();
    if(!L.reliable)ongoing={status:'uncertain',why:'Some of your latest entries have no recorded time.'};
    else{
      const mins=(now-L.last)/60000;
      if(mins<0)ongoing={status:'uncertain',why:'Your latest entry is timed in the future.'};
      else if(mins>48*60)ongoing={status:'stale',why:'No food logged since '+fmtDT(L.last)+'. A long gap in the log is not proof of a fast.',last:L.last};
      else ongoing={status:'ongoing',start:L.last,mins:mins,band:bandOf(mins)};
    }
  }
  return {complete:complete,uncertain:uncertain,ongoing:ongoing,untimedEntries:untimedEntries,loggedDays:keys.length};
}

function fastTimelineHTML(mins,activeId){
  const N=FAST_BANDS.length;
  let pos=null;
  if(mins!=null){const b=bandOf(mins),i=bandIdx(b),next=FAST_BANDS[i+1],span=next?next.min-b.min:720;pos=(i+Math.min(0.95,(mins-b.min)/span))/N*100;}
  const act=activeId?bandIdx(FAST_BANDS.filter(function(b){return b.id===activeId;})[0]):(mins!=null?bandIdx(bandOf(mins)):-1);
  return `<div class="ftl" role="group" aria-label="Fasting duration categories">
    <div class="ftl-bar">${FAST_BANDS.map(function(b,i){return `<button class="ftl-seg ${i===act?'on':''}" style="--c:${b.color};${i<=act&&mins!=null&&!activeId?'background:'+b.color+';':''}" onclick="selFastCat('${b.id}')" aria-label="${esc(b.name)}"></button>`;}).join('')}</div>
    ${pos!=null?`<div class="ftl-mark" style="left:${pos.toFixed(1)}%">▼</div>`:''}
    <div class="ftl-lbl">${FAST_BANDS.map(function(b){return `<span>${b.short}</span>`;}).join('')}</div></div>`;
}
function fastIntervalRow(it){
  const b=it.band;
  return `<div class="fi"><div class="fi-top"><b>${fmtDur(it.mins)}</b><span class="chip" style="color:${b.color};background:${b.color}22">${esc(b.pat?b.pat+' pattern':b.name)}</span><span class="chip" style="color:#94a3b8;background:rgba(148,163,184,.12)">complete</span></div>
    <div class="note">${fmtDT(it.start)} → ${fmtDT(it.end)} <span style="color:#475569">(from recorded intake)</span></div></div>`;
}
function fastUncRow(u){return `<div class="fi"><div class="fi-top"><b style="color:#94a3b8">Uncertain</b><span class="chip" style="color:#94a3b8;background:rgba(148,163,184,.12)">not classified</span></div><div class="note">Ending ${fmtShort(u.endDay)} — ${esc(u.why)}</div></div>`;}

function secFasting(c){
  const F=c.fast||(c.fast=computeFasts());
  const inR=F.complete.filter(function(i){return i.endDay>=c.a&&i.endDay<=c.t;});
  const uncR=F.uncertain.filter(function(i){return i.endDay>=c.a&&i.endDay<=c.t;});
  const title='Fasting stages';
  if(!F.complete.length&&!(F.ongoing&&F.ongoing.status==='ongoing')){
    return secCard('fasting',{title:title,body:noData(F.loggedDays?`Not enough timed data yet. A fasting interval needs a recorded time for the last food of one day <i>and</i> the first food of the next day. ${F.untimedEntries?F.untimedEntries+' older entr'+(F.untimedEntries>1?'ies have':'y has')+' no recorded time and '+(F.untimedEntries>1?'are':'is')+' left out. ':''}New entries record the time automatically.`:'Log meals with their times to see fasting-duration categories.')});
  }
  const on=F.ongoing&&F.ongoing.status==='ongoing'?F.ongoing:null;
  const latest=F.complete.length?F.complete[F.complete.length-1]:null;
  const focusMins=on?on.mins:(latest?latest.mins:null),focusBand=on?on.band:(latest?latest.band:null);
  const sel=aFastCat?FAST_BANDS.filter(function(b){return b.id===aFastCat;})[0]:null;
  const shown=sel||focusBand;
  // headline
  let head;
  if(on)head=`<div class="headline"><div class="big" style="color:${on.band.color}">${fmtDur(on.mins)}</div><span class="chip" style="color:#fbbf24;background:#fbbf2420">ongoing · estimated from your food logs</span></div>
      <div class="note">Since your last logged intake at ${fmtDT(on.start)}. Updates when you open or refresh the app — not a timer.</div>`;
  else head=`<div class="headline"><div class="big" style="color:${latest.band.color}">${fmtDur(latest.mins)}</div><span class="chip" style="color:#94a3b8;background:rgba(148,163,184,.14)">last completed interval</span></div>
      <div class="note">${fmtDT(latest.start)} → ${fmtDT(latest.end)}, based on recorded intake.${F.ongoing&&F.ongoing.status!=='ongoing'?' '+esc(F.ongoing.why):''}</div>`;
  const expl=`<div class="fx-ex" style="border-color:${shown.color}66"><b style="color:${shown.color}">${esc(shown.name)}${shown.pat?' · '+shown.pat:''}</b>${sel?` <span class="note">(showing the selected category)</span>`:''}<div class="note" style="color:#cbd5e1;margin-top:3px">${esc(shown.ex)}${shown.warn?' Neutral caution: this is a long interval and may not be suitable for everyone.':''}</div></div>`;
  // stats
  const durs=inR.map(function(i){return i.mins;});
  const avg=durs.length?durs.reduce(function(a,b){return a+b;},0)/durs.length:null,med=median(durs);
  const mini=durs.length?miniRow([['Average',fmtDur(avg)],['Median',fmtDur(med)],['Longest',fmtDur(Math.max.apply(null,durs))],['Shortest',fmtDur(Math.min.apply(null,durs))]]):'';
  // distribution rows
  const byBand={};FAST_BANDS.forEach(function(b){byBand[b.id]=[];});inR.forEach(function(i){byBand[i.band.id].push(i);});
  const dist=FAST_BANDS.map(function(b){
    const list=byBand[b.id],n=list.length,pct=inR.length?n/inR.length*100:0,open=aFastCat===b.id;
    return `<div class="fc ${open?'on':''}"><button class="fc-row" onclick="selFastCat('${b.id}')" aria-expanded="${open}"><span class="dot" style="background:${b.color}"></span><span class="fc-n">${esc(b.name)}${b.pat?' <em>'+b.pat+'</em>':''}</span><span class="fc-c"><b>${n}</b> day${n===1?'':'s'} · ${pct.toFixed(0)}%</span></button>
      <div class="fc-bar"><i style="width:${pct.toFixed(1)}%;background:${b.color}"></i></div>
      ${open?`<div class="fc-more">${n?list.slice().reverse().map(fastIntervalRow).join(''):'<div class="note">No completed intervals in this category within the selected range.</div>'}</div>`:''}</div>`;
  }).join('');
  const body=`${head}${fastTimelineHTML(focusMins,aFastCat)}${expl}${mini}
    <div class="sub-t" style="margin-top:14px">Days in each category <span class="note">(${inR.length} completed interval${inR.length===1?'':'s'} in range · tap a row for dates)</span></div>${dist}
    ${uncR.length?`<div class="note" style="margin-top:8px">${uncR.length} interval${uncR.length===1?'':'s'} in this range couldn't be classified because of missing or untimed logs (see details).</div>`:''}
    ${on&&on.band.warn?`<div class="insight" style="background:#fbbf2410;border:1px solid #fbbf2425;margin-top:10px"><span class="insight-text" style="color:#fbbf24">Estimated gap is long. Prolonged fasting is not suitable for everyone — this isn't a target.</span></div>`:''}`;
  // details
  let detail='';
  // calendar strip
  const stripFrom=daysBetween(c.a,c.t)+1>120?addDays(c.t,-119):c.a;
  const endMap={};F.complete.forEach(function(i){endMap[i.endDay]=i;});const uncMap={};F.uncertain.forEach(function(u){uncMap[u.endDay]=u;});
  const cells=dateList(stripFrom,c.t).map(function(d){
    const i=endMap[d],u=uncMap[d],sl=aFastDay===d;
    const st=i?`background:${i.band.color}`:u?'background:repeating-linear-gradient(45deg,#334155,#334155 3px,#1e293b 3px,#1e293b 6px)':'background:rgba(255,255,255,0.06)';
    return `<button class="fcell ${sl?'sel':''}" style="${st}" onclick="selFastDay('${d}')" aria-label="${fmtLong(d)}: ${i?esc(i.band.name)+' '+fmtDur(i.mins):u?'uncertain':'no interval'}"></button>`;
  }).join('');
  let dayInfo='';
  if(aFastDay){const i=endMap[aFastDay],u=uncMap[aFastDay];dayInfo=`<div class="selday"><b>${fmtLong(aFastDay)}</b><div style="margin-top:6px">${i?fastIntervalRow(i):u?fastUncRow(u):'<span class="note">No interval ends on this day (nothing logged, or it is the first logged day).</span>'}</div></div>`;}
  detail+=`<div class="sub-t">Category reached each day <span class="note">(day the interval ended)</span></div><div class="fcells">${cells}</div>
    <div class="legend">${FAST_BANDS.map(function(b){return `<span><i style="background:${b.color}"></i>${b.short}</span>`;}).join('')}<span><i style="background:#334155"></i>Uncertain</span><span><i style="background:rgba(255,255,255,0.1)"></i>None</span></div>${dayInfo}`;
  // duration chart
  const chartItems=inR.slice(-60).map(function(i){return {label:fmtShort(i.endDay),v:i.mins/60,color:i.band.color,tip:fmtShort(i.endDay)+': '+fmtDur(i.mins)+' · '+i.band.name};});
  detail+=`<div class="sub-t">Interval length <span class="note">(hours, colored by category${inR.length>60?', latest 60':''})</span></div>${chartOrNone(barChartSVG(chartItems,{w:CH.w,fs:CH.fs,h:150}))}
    <div class="note">${inR.length>=3?'Colors show the category, not a score — longer is not better.':'Needs a few completed intervals to show a pattern.'}</div>`;
  // weekly / monthly
  const grp=function(keyf,labelf,max){
    const m={};inR.forEach(function(i){const k=keyf(i.endDay);(m[k]||(m[k]=[])).push(i);});
    const ks=Object.keys(m).sort().slice(-max);let prev=null;
    const rows=ks.map(function(k){
      const l=m[k],a=l.reduce(function(s,i){return s+i.mins;},0)/l.length,cnt={};l.forEach(function(i){cnt[i.band.id]=(cnt[i.band.id]||0)+1;});
      const top=FAST_BANDS.slice().sort(function(x,y){return (cnt[y.id]||0)-(cnt[x.id]||0);})[0];
      const dl=prev!=null?(a-prev):null;prev=a;
      return {k:k,row:kvr(labelf(k),fmtDur(a)+' avg · '+l.length+' int. · most: '+(top.pat||top.short)+(dl!=null?' <span style="color:#94a3b8;font-weight:500">('+(dl>=0?'+':'−')+Math.round(Math.abs(dl))+' min)</span>':''))};
    });
    return rows.map(function(r){return r.row;}).reverse().join('')||noData('No data in range.');
  };
  detail+=`<div class="sub-t">Weekly pattern <span class="note">(changes are vs the previous listed week)</span></div>${grp(function(d){return mondayOf(d);},function(k){return 'Week of '+fmtShort(k);},8)}
    <div class="sub-t">Monthly pattern</div>${grp(function(d){return d.slice(0,7);},function(k){return parseDS(k+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'});},6)}`;
  // list
  const all=inR.slice().reverse(),lst=aFastAll?all:all.slice(0,10);
  detail+=`<div class="sub-t">Completed intervals <span class="note">(${all.length} in range)</span></div>${lst.map(fastIntervalRow).join('')||noData('None in this range.')}${all.length>10?`<button class="btn btn-sm btn-ghost" style="width:100%;margin-top:8px" onclick="toggleFastAll()">${aFastAll?'Show fewer':'Show all '+all.length}</button>`:''}`;
  if(uncR.length)detail+=`<div class="sub-t">Uncertain intervals <span class="note">(excluded from all statistics)</span></div>${uncR.slice().reverse().slice(0,15).map(fastUncRow).join('')}`;
  detail+=`<div class="sub-t">How this works</div><div class="note">An interval runs from the last logged calorie intake of one day to the first logged intake of the next consecutive day (food logged before ${FAST_DAY_START_H} AM counts toward the previous day; zero-calorie entries are ignored). Only entries with a real recorded time are used. If a day has no logs or untimed entries, the interval is shown as uncertain — a missing log is never treated as a fast. The ongoing figure is the time since your last logged intake, estimated when the app opens.</div>
    <div class="insight" style="background:#fbbf2410;border:1px solid #fbbf2425;margin-top:10px;display:block"><span class="insight-text" style="color:#fbbf24;font-size:12px;line-height:1.5">${FAST_SAFETY}</span></div>`;
  return secCard('fasting',{title:title,body:body,detail:detail});
}

// ── NEW THEMES: interactive backgrounds (Lava Lamp, Blueprint, Tidepool, Vital Sign) ──
(function(){
const NEW=['lava','blueprint','tide','vital'],T={x:innerWidth/2,y:innerHeight*.4,d:0,beat:0,sv:0,ly:scrollY,lx:0,ky:0},RIP=[];
function mv(x,y){T.x=x;T.y=y;if(curTheme==='tide'&&motionOn&&Math.hypot(x-T.lx,y-T.ky)>26){T.lx=x;T.ky=y;if(RIP.length<40)RIP.push({x:x,y:y,r:3,m:70,a:.55});}}
addEventListener('pointermove',function(e){mv(e.clientX,e.clientY);},{passive:true});
addEventListener('touchmove',function(e){const t=e.touches[0];if(t)mv(t.clientX,t.clientY);},{passive:true});
addEventListener('pointerdown',function(e){T.x=e.clientX;T.y=e.clientY;T.d=1;T.beat=1;if(RIP.length<40)RIP.push({x:e.clientX,y:e.clientY,r:6,m:230,a:.9});},{passive:true});
['pointerup','pointercancel'].forEach(function(n){addEventListener(n,function(){T.d=0;},{passive:true});});
addEventListener('scroll',function(){T.sv=Math.max(-24,Math.min(24,scrollY-T.ly));T.ly=scrollY;},{passive:true});

function lava(W,H,cx){
  const sc=8,w=Math.ceil(W/sc),h=Math.ceil(H/sc),oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const ox=oc.getContext('2d'),id=ox.createImageData(w,h),D=id.data,B=[],me={x:0,y:0,r:60};
  for(let i=0;i<9;i++)B.push({x:Math.random()*W,y:Math.random()*H,vx:Math.random()-.5,vy:Math.random()-.5,r:55+Math.random()*60});
  return function(){
    me.x=T.x;me.y=T.y;me.r=60+T.d*40;
    B.forEach(function(b){const dx=T.x-b.x,dy=T.y-b.y,d=Math.hypot(dx,dy)+1,g=(d<320?.05:.006)*(1+T.d*3);
      b.vx+=dx/d*g+(Math.random()-.5)*.06;b.vy+=dy/d*g+(Math.random()-.5)*.06-T.sv*.03;
      b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy;
      if(b.x<0||b.x>W)b.vx*=-1;if(b.y<-50||b.y>H+50)b.vy*=-1;});
    const all=B.concat(me);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let f=0;const X=x*sc,Y=y*sc;
      for(let k=0;k<all.length;k++){const b=all[k],dx=X-b.x,dy=Y-b.y;f+=b.r*b.r/(dx*dx+dy*dy+1);}
      const i=(y*w+x)*4,a=Math.max(0,Math.min(1,(f-.8)*2.5)),t=Math.max(0,Math.min(1,(f-1)/2));
      D[i]=230+25*t;D[i+1]=40+170*t;D[i+2]=120-70*t;D[i+3]=a*(120+90*t);}
    ox.putImageData(id,0,0);cx.clearRect(0,0,W,H);cx.imageSmoothingEnabled=true;cx.drawImage(oc,0,0,W,H);
  };
}
function blueprint(W,H,cx){
  return function(){
    cx.clearRect(0,0,W,H);cx.lineWidth=1;cx.strokeStyle='rgba(224,242,254,.6)';cx.setLineDash([6,6]);
    cx.beginPath();cx.moveTo(0,T.y);cx.lineTo(W,T.y);cx.moveTo(T.x,0);cx.lineTo(T.x,H);cx.stroke();cx.setLineDash([]);
    cx.beginPath();cx.arc(T.x,T.y,16+T.d*12,0,6.283);cx.stroke();
    cx.fillStyle='#e0f2fe';
    for(let gx=Math.floor((T.x-120)/24)*24;gx<T.x+120;gx+=24)for(let gy=Math.floor((T.y-120)/24)*24;gy<T.y+120;gy+=24){const d=Math.hypot(gx-T.x,gy-T.y);if(d<120){cx.globalAlpha=1-d/120;cx.fillRect(gx-1.5,gy-1.5,3,3);}}
    cx.globalAlpha=1;cx.font='600 11px "Chakra Petch",monospace';
    cx.fillText('X '+Math.round(T.x)+'  Y '+Math.round(T.y+scrollY),Math.min(T.x+24,W-110),Math.max(T.y-12,14));
  };
}
function tide(W,H,cx){
  function nb(init){return{x:Math.random()*W,y:init?Math.random()*H:H+20,r:3+Math.random()*11,v:.25+Math.random()*.6,p:Math.random()*6.28};}
  const Bu=[];for(let i=0;i<26;i++)Bu.push(nb(true));
  return function(){
    cx.clearRect(0,0,W,H);
    Bu.forEach(function(b,i){b.y-=b.v-T.sv*.05;b.p+=.02;b.x+=Math.sin(b.p)*.35;
      if(b.y<-20){Bu[i]=nb();return;}
      if(Math.hypot(b.x-T.x,b.y-T.y)<b.r+24&&RIP.length<40){RIP.push({x:b.x,y:b.y,r:b.r,m:90,a:.6});Bu[i]=nb();return;}
      cx.globalAlpha=1;cx.lineWidth=1.2;cx.strokeStyle='rgba(190,255,245,.4)';cx.fillStyle='rgba(255,255,255,.05)';
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.283);cx.fill();cx.stroke();
      cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.arc(b.x-b.r*.35,b.y-b.r*.35,Math.max(1,b.r*.2),0,6.283);cx.fill();});
    for(let i=RIP.length-1;i>=0;i--){const r=RIP[i];r.r+=2.4;const k=r.r/r.m;if(k>=1){RIP.splice(i,1);continue;}
      cx.globalAlpha=r.a*(1-k);cx.lineWidth=2;cx.strokeStyle='#5eead4';cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.stroke();
      cx.strokeStyle='#f9a8d4';cx.lineWidth=1;cx.beginPath();cx.arc(r.x,r.y,r.r*.72,0,6.283);cx.stroke();}
    cx.globalAlpha=1;
  };
}
function vital(W,H,cx){
  const st=2.2,N=Math.ceil(W/st),base=H*.8,tr=new Array(N).fill(0),L=N-14;let hx=0,bt=999,A=55,ph=0;
  function wv(t,a){if(t<6)return -5*Math.sin(Math.PI*t/6);if(t>=10&&t<12)return 6;if(t>=12&&t<17)return -a*Math.sin(Math.PI*(t-12)/5);if(t>=17&&t<20)return 14*Math.sin(Math.PI*(t-17)/3);if(t>=28&&t<44)return -11*Math.sin(Math.PI*(t-28)/16);return 0;}
  return function(){
    ph++;hx=(hx+1)%N;
    if(T.beat){T.beat=0;bt=0;A=100;}else if(ph%120===0||(Math.abs(T.sv)>8&&bt>50)){bt=0;A=55;}
    bt++;tr[hx]=wv(bt,A);
    cx.clearRect(0,0,W,H);cx.lineWidth=2;cx.lineJoin='round';cx.strokeStyle='#39ff88';
    for(let b=0;b<8;b++){cx.globalAlpha=1-b/8.5;cx.beginPath();let pi=-1;
      for(let j=Math.floor(b*L/8);j<=Math.floor((b+1)*L/8);j++){const i=((hx-j)%N+N)%N,x=i*st,y=base+tr[i];if(pi<0||i>pi)cx.moveTo(x,y);else cx.lineTo(x,y);pi=i;}
      cx.stroke();}
    cx.globalAlpha=.35;cx.fillStyle='#39ff88';cx.beginPath();cx.arc(hx*st,base+tr[hx],7,0,6.283);cx.fill();
    cx.globalAlpha=1;cx.fillStyle='#eafff2';cx.beginPath();cx.arc(hx*st,base+tr[hx],3,0,6.283);cx.fill();
  };
}
const baseFx=fxStart;
fxStart=function(){
  baseFx();cancelAnimationFrame(window.__nf||0);
  const cv=document.getElementById('fx'),m=curTheme;
  if(!cv||!motionOn||NEW.indexOf(m)<0)return;
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight,cx=cv.getContext('2d');
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const draw=({lava:lava,blueprint:blueprint,tide:tide,vital:vital})[m](W,H,cx);
  (function loop(){if(!document.hidden){T.sv*=.9;draw();}window.__nf=requestAnimationFrame(loop);})();
};
})();

ensureIds();
try{if((S.goals.protein||150)<=todayEntries().reduce(function(s,e){return s+(+e.protein||0);},0))uiSet('ftui_cel',today());}catch(e){}
